                                                      className="abono-input"
                                                      placeholder={g.moneda === 'USD' ? 'Monto ($)' : 'Monto (Q)'}
                                                      value={editGastoTCMonto}
                                                      onChange={(e2) => setEditGastoTCMonto(e2.target.value)}
                                                      onKeyDown={(e2) => { if (e2.key === 'Enter') guardarEdicionGastoTC(g.id); if (e2.key === 'Escape') setEditandoGastoTCId(null); }}
                                                    />
                                                    <button className="icon-btn small" onClick={() => guardarEdicionGastoTC(g.id)} aria-label="Guardar"><Icon name="check" size={16} /></button>
                                                    <button className="icon-btn small" onClick={() => setEditandoGastoTCId(null)} aria-label="Cancelar"><Icon name="x" size={16} /></button>
                                                  </div>
                                                )}
                                                {editandoGastoTCId === g.id && g.moneda === 'USD' && editGastoTCMonto && parseFloat(editGastoTCMonto) > 0 && (
                                                  <p className="hint">≈ {formatQ(parseFloat(editGastoTCMonto) * tcActual)} con la tasa actual (Q{tcActual})</p>
                                                )}
                                              </div>
                                            </div>
                                            {editandoGastoTCId !== g.id && (
                                              <div className="row-actions">
                                                <span className="amount-mono negative">-{formatQ(g.monto)}</span>
                                                {botonPagada(e)}
                                                <button className="icon-btn small" onClick={() => iniciarEdicionGastoTC(g)} aria-label="Editar monto"><Icon name="pencil" size={13} /></button>
                                                {confirmingId === `tc__${g.id}` ? (
                                                  <span className="confirm-group">
                                                    <span className="confirm-warning">¿Eliminar? No se puede deshacer.</span>
                                                    <button className="btn-add danger small" onClick={() => { removeGastoTC(g.id); setConfirmingId(null); }}>Sí, eliminar</button>
                                                    <button className="icon-btn small" onClick={() => setConfirmingId(null)} aria-label="Cancelar"><Icon name="x" size={14} /></button>
                                                  </span>
                                                ) : (
                                                  <button className="icon-btn small danger" onClick={() => setConfirmingId(`tc__${g.id}`)} aria-label="Eliminar gasto con TC"><Icon name="trash" size={14} /></button>
                                                )}
                                              </div>
                                            )}
                                          </li>
                                        );
                                      })}
                                    </ul>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </li>
                      )}
                      </React.Fragment>
                    );
                  })}
                </ul>
              )}

              {historialPagosTarjeta.length > 0 && (
                <>
                  <h2 className="section-title" style={{ marginTop: 18 }}>Pagos de {monthLabel(currentMonth)}</h2>
                  <ul className="ledger-list">
                    {historialPagosTarjeta.map((p) => (
                      <li key={p.id} className="ledger-row">
                        <div className="row-main">
                          <span className="cat-badge tarjeta-badge"><Icon name="creditCard" size={16} /></span>
                          <DayBadge dia={parseISODate(p.fecha).getDate()} />
                          <div className="row-desc">
                            {p.tarjetaNombre} <span className="cat-name">{formatFechaCorta(parseISODate(p.fecha))}</span>
                            {p.moneda === 'USD' && <span className="pill pill-usd">${p.montoOriginal.toFixed(2)} USD</span>}
                            {editExternoId === p.id && <span className="hint" style={{ width: '100%' }}>¿Cuánto de este pago fue de compras que no anotaste? Deja vacío o 0 para quitarlo.</span>}
                            {montoNoRegistrado(p) > 0 && <span className="pill pill-parcial">{montoNoRegistrado(p) >= p.monto - 0.005 ? 'Todo de compras no registradas' : `${formatQ(montoNoRegistrado(p))} de compras no registradas`}</span>}
                          </div>
                        </div>
                        <div className="row-actions">
                          <span className="amount-mono positive">+{formatQ(p.monto)}</span>
                          {editExternoId === p.id ? (
                            <span className="abono-form" style={{ marginTop: 0 }}>
                              <input type="number" step="0.01" min="0" autoFocus className="abono-input" style={{ width: 110 }}
                                     placeholder="Monto (Q)" value={editExternoDraft}
                                     onChange={(e) => setEditExternoDraft(e.target.value)}
                                     onKeyDown={(e) => { if (e.key === 'Enter') guardarExternoPago(p.id, editExternoDraft); if (e.key === 'Escape') setEditExternoId(null); }} />
                              <button className="icon-btn small" onClick={() => guardarExternoPago(p.id, editExternoDraft)} aria-label="Guardar"><Icon name="check" size={15} /></button>
                              <button className="icon-btn small" onClick={() => setEditExternoId(null)} aria-label="Cancelar"><Icon name="x" size={15} /></button>
                            </span>
                          ) : (
                            <button className="link-toggle" onClick={() => { setEditExternoId(p.id); setEditExternoDraft(montoNoRegistrado(p) > 0 ? String(+montoNoRegistrado(p).toFixed(2)) : ''); }}
                                    title="Indica cuánto de este pago fue para compras que no anotaste en la app">
                              {montoNoRegistrado(p) > 0 ? 'Editar no registradas' : 'Compras no registradas'}
                            </button>
                          )}
                          {confirmingId === `pago__${p.id}` ? (
                            <span className="confirm-group">
                              <span className="confirm-warning">¿Eliminar? No se puede deshacer.</span>
                              <button className="btn-add danger small" onClick={() => removePagoTarjeta(p.id)}>Sí, eliminar</button>
                              <button className="icon-btn small" onClick={() => setConfirmingId(null)} aria-label="Cancelar"><Icon name="x" size={14} /></button>
                            </span>
                          ) : (
                            <button className="icon-btn small danger" onClick={() => setConfirmingId(`pago__${p.id}`)} aria-label="Eliminar pago"><Icon name="trash" size={14} /></button>
                          )}
                        </div>
                      </li>
                    ))}
                  </ul>
                </>
              )}
            </div>
          )}
          </>
        )}

        {view === 'ajustes' && (
          <>
          {data.tarjetas.length > 0 && (
            <div className="card">
              <h2 className="section-title">Tus tarjetas</h2>
              <p className="section-sub">Edita el nombre, día de corte y día de pago, o elimina una tarjeta.</p>
              <ul className="ledger-list">
                {data.tarjetas.map((t) => (
                  <li key={t.id} className="ledger-row">
                    {editandoTarjetaId === t.id ? (
                      <div className="form-grid" style={{ width: '100%' }}>
                        <input className="field" placeholder="Nombre de la tarjeta" value={editTarjetaNombre} onChange={(e) => setEditTarjetaNombre(e.target.value)} />
                        <div className="monto-row">
                          <input className="field" type="number" min="1" max="31" placeholder="Día de corte" value={editTarjetaCorte} onChange={(e) => setEditTarjetaCorte(e.target.value)} />
                          <input className="field" type="number" min="1" max="31" placeholder="Día de pago" value={editTarjetaPago} onChange={(e) => setEditTarjetaPago(e.target.value)} />
                        </div>
                        <div className="monto-row">
                          <button className="btn-add" style={{ flex: 1 }} onClick={() => guardarEdicionTarjeta(t.id)}
                                  disabled={!editTarjetaNombre.trim() || !editTarjetaCorte || !editTarjetaPago}>
                            <Icon name="check" size={15} /> Guardar
                          </button>
                          <button className="icon-btn" onClick={() => setEditandoTarjetaId(null)} aria-label="Cancelar"><Icon name="x" size={16} /></button>
                        </div>
                      </div>
                    ) : (
                      <>
                        <div className="row-main">
                          <span className="cat-badge tarjeta-badge"><Icon name="creditCard" size={16} /></span>
                          <div className="row-desc">
                            {t.nombre} <span className="cat-name">corte {t.diaCorte}, pago {t.diaPago}</span>
                          </div>
                        </div>
                        <div className="row-actions">
                          <button className="icon-btn small" onClick={() => {
                            setEditTarjetaNombre(t.nombre); setEditTarjetaCorte(String(t.diaCorte)); setEditTarjetaPago(String(t.diaPago));
                            setEditandoTarjetaId(t.id);
                          }} aria-label="Editar tarjeta"><Icon name="pencil" size={13} /></button>
                          {confirmingId === `ajustes-tarjeta__${t.id}` ? (
                            <span className="confirm-group">
                              <span className="confirm-warning">¿Eliminar? No se puede deshacer.</span>
                              <button className="btn-add danger small" onClick={() => { removeTarjeta(t.id); setConfirmingId(null); }}>Sí, eliminar</button>
                              <button className="icon-btn small" onClick={() => setConfirmingId(null)} aria-label="Cancelar"><Icon name="x" size={14} /></button>
                            </span>
                          ) : (
                            <button className="icon-btn small danger" onClick={() => setConfirmingId(`ajustes-tarjeta__${t.id}`)} aria-label="Eliminar tarjeta"><Icon name="trash" size={14} /></button>
                          )}
                        </div>
                      </>
                    )}
                  </li>
                ))}
              </ul>
            </div>
          )}
          {data.tarjetas.length > 0 && (
            <div className="card">
              <h2 className="section-title">Saldo inicial de tarjetas</h2>
              <p className="section-sub">Lo que cada tarjeta ya debía antes de que la registraras en la app. Vence en la siguiente fecha de pago y tus pagos lo van bajando.</p>
              <ul className="ledger-list">
                {data.tarjetas.map((t) => (
                  <li key={t.id} className="ledger-row">
                    {saldoEditId === t.id ? (
                      <div className="form-grid" style={{ width: '100%' }}>
                        <div className="row-desc">{t.nombre}</div>
                        <label className="field-label">
                          Saldo según el banco y a qué fecha
                          <div className="monto-row">
                            <input className="field" type="number" step="0.01" min="0" autoFocus placeholder="0.00" value={saldoDraft}
                                   onChange={(e) => setSaldoDraft(e.target.value)}
                                   onKeyDown={(e) => { if (e.key === 'Enter') guardarSaldoInicial(t.id); if (e.key === 'Escape') setSaldoEditId(null); }} />
                            <input className="field" type="date" value={saldoFechaDraft} onChange={(e) => setSaldoFechaDraft(e.target.value)} />
                          </div>
                        </label>
                        <p className="hint">Los pagos que registres después de esa fecha lo van bajando. Déjalo vacío o en 0 para quitarlo.</p>
                        <div className="monto-row">
                          <button className="btn-add" style={{ flex: 1 }} onClick={() => guardarSaldoInicial(t.id)}><Icon name="check" size={15} /> Guardar</button>
                          <button className="icon-btn" onClick={() => setSaldoEditId(null)} aria-label="Cancelar"><Icon name="x" size={16} /></button>
                        </div>
                      </div>
                    ) : (
                      <>
                        <div className="row-main">
                          <span className="cat-badge tarjeta-badge"><Icon name="creditCard" size={16} /></span>
                          <div>
                            <div className="row-desc">{t.nombre}</div>
                            <p className="meta-detail">{t.saldoInicial ? `Al ${formatFechaCorta(parseISODate(t.fechaSaldoInicial))}` : 'Sin saldo inicial'}</p>
                          </div>
                        </div>
                        <div className="row-actions">
                          <span className="amount-mono">{t.saldoInicial ? formatQ(t.saldoInicial) : '—'}</span>
                          <button className="icon-btn small" aria-label="Editar saldo inicial"
                                  onClick={() => { setSaldoDraft(t.saldoInicial ? String(t.saldoInicial) : ''); setSaldoFechaDraft(t.fechaSaldoInicial || hoyISO()); setSaldoEditId(t.id); }}>
                            <Icon name="pencil" size={13} />
                          </button>
                        </div>
                      </>
                    )}
                  </li>
                ))}
              </ul>
            </div>
          )}
          {((data.ajustesTarjeta || []).length > 0 || data.tarjetas.some((t) => t.conciliacion)) && (
            <div className="card">
              <h2 className="section-title">Ajustes de saldo</h2>
              <p className="section-sub">Saldos que ajustaste con "Ajustar saldo". Desde esa fecha la app toma ese monto como lo que debes; lo anterior queda como pagado.</p>
              <ul className="ledger-list">
                {data.tarjetas.filter((t) => t.conciliacion).map((t) => (
                  <li key={`conc-${t.id}`} className="ledger-row">
                    <div className="row-main">
                      <span className="cat-badge tarjeta-badge"><Icon name="pencil" size={14} /></span>
                      <div>
                        <div className="row-desc">{t.nombre}</div>
                        <p className="meta-detail">Saldo al {formatFechaCorta(parseISODate(t.conciliacion.fecha))}</p>
                      </div>
                    </div>
                    <div className="row-actions">
                      <span className="amount-mono">{formatQ(t.conciliacion.saldo)}</span>
                      {confirmingId === `conc__${t.id}` ? (
                        <span className="confirm-group">
                          <span className="confirm-warning">¿Quitar ajuste?</span>
                          <button className="btn-add danger small" onClick={() => { quitarConciliacion(t.id); setConfirmingId(null); }}>Sí, quitar</button>
                          <button className="icon-btn small" onClick={() => setConfirmingId(null)} aria-label="Cancelar"><Icon name="x" size={14} /></button>
                        </span>
                      ) : (
                        <button className="icon-btn small danger" onClick={() => setConfirmingId(`conc__${t.id}`)} aria-label="Quitar ajuste de saldo"><Icon name="trash" size={14} /></button>
                      )}
                    </div>
                  </li>
                ))}
                {[...(data.ajustesTarjeta || [])].sort((a, b) => (a.mes < b.mes ? 1 : -1)).map((a) => {
                  const t = data.tarjetas.find((x) => x.id === a.tarjetaId);
                  return (
                    <li key={a.id} className="ledger-row">
                      <div className="row-main">
                        <span className="cat-badge tarjeta-badge"><Icon name="pencil" size={14} /></span>
                        <div>
                          <div className="row-desc">{t ? t.nombre : 'Tarjeta eliminada'}</div>
                          <p className="meta-detail">Estado de cuenta de {monthLabel(a.mes)}</p>
                        </div>
                      </div>
                      <div className="row-actions">
                        <span className={`amount-mono ${a.monto < 0 ? 'positive' : 'negative'}`}>{a.monto < 0 ? '-' : '+'}{formatQ(Math.abs(a.monto))}</span>
                        {confirmingId === `ajuste__${a.id}` ? (
                          <span className="confirm-group">
                            <span className="confirm-warning">¿Quitar ajuste?</span>
                            <button className="btn-add danger small" onClick={() => { quitarAjuste(a.id); setConfirmingId(null); }}>Sí, quitar</button>
                            <button className="icon-btn small" onClick={() => setConfirmingId(null)} aria-label="Cancelar"><Icon name="x" size={14} /></button>
                          </span>
                        ) : (
                          <button className="icon-btn small danger" onClick={() => setConfirmingId(`ajuste__${a.id}`)} aria-label="Quitar ajuste"><Icon name="trash" size={14} /></button>
                        )}
                      </div>
                    </li>
                  );
                })}
              </ul>
            </div>
          )}
          <div className="card">
            <h2 className="section-title">Consultas</h2>
            <p className="section-sub">Respuestas rápidas sobre cómo calcula la app.</p>
            <div className="faq-list">
              {CONSULTAS.map((c, i) => (
                <details key={i} className="faq-item">
                  <summary>{c.pregunta}<Icon name="chevronDown" size={15} /></summary>
                  <div className="faq-body">{c.respuesta.map((r, j) => <p key={j}>{r}</p>)}</div>
                </details>
              ))}
            </div>
          </div>
          <div className="card">
            <h2 className="section-title">Configuración</h2>
            <p className="section-sub">Ajustes generales de la app.</p>
            <div className="settings-row">
              <div>
                <div className="settings-row-title">Calcular tarjetas por fecha de corte</div>
                <p className="meta-detail">Apagado (recomendado): cada compra suma a tu deuda el día que la haces. Encendido: las compras se cobran en la fecha de pago de su corte.</p>
              </div>
              <button type="button" role="switch" aria-checked={modoPorCorte(data)}
                      className={`switch ${modoPorCorte(data) ? 'on' : ''}`}
                      onClick={() => setData((prev) => ({ ...prev, config: { ...(prev.config || {}), modoTarjeta: modoPorCorte(prev) ? 'saldo' : 'corte' } }))}>
                <span className="switch-knob" />
              </button>
            </div>
            <div className="settings-row">
              <div>
                <div className="settings-row-title">Marcar compras como pagadas</div>
                <p className="meta-detail">Encendido: en Tarjetas aparece "Marcar pagada" en cada compra pendiente. Apagado: se ocultan esos botones (lo ya marcado se conserva).</p>
              </div>
              <button type="button" role="switch" aria-checked={!!(data.config && data.config.marcarPagadas)}
                      className={`switch ${data.config && data.config.marcarPagadas ? 'on' : ''}`}
                      onClick={() => setMarcarPagadas(!(data.config && data.config.marcarPagadas))}>
                <span className="switch-knob" />
              </button>
            </div>
            <div className="settings-row settings-col">
              <div className="settings-row-top">
                <div>
                  <div className="settings-row-title">Exportar mis datos</div>
                  <p className="meta-detail">Descarga un archivo protegido con contraseña con todos tus registros.</p>
                </div>
                {!exportForm && <button className="btn-add small" onClick={() => { setExportForm(true); setExportMsg(''); }}>Exportar</button>}
              </div>
              {exportForm && (
                <div className="form-grid" style={{ marginTop: 10 }}>
                  <input className="field" type="password" placeholder="Contraseña para el archivo (8+ caracteres)" value={exportPass} onChange={(e) => setExportPass(e.target.value)} autoComplete="new-password" />
                  <input className="field" type="password" placeholder="Repite la contraseña" value={exportPass2} onChange={(e) => setExportPass2(e.target.value)} autoComplete="new-password" />
                  <div className="monto-row">
                    <button className="btn-add" style={{ flex: 1 }} onClick={exportarDatos}><Icon name="check" size={15} /> Descargar archivo</button>
                    <button className="icon-btn" onClick={() => { setExportForm(false); setExportPass(''); setExportPass2(''); }} aria-label="Cancelar"><Icon name="x" size={16} /></button>
                  </div>
                </div>
              )}
              {exportMsg && <p className="hint" style={{ marginTop: 8 }}>{exportMsg}</p>}
            </div>
            <div className="settings-row settings-col">
              <div>
                <div className="settings-row-title">Importar un archivo exportado</div>
                <p className="meta-detail">Recupera tus datos desde un archivo de "Exportar". Reemplaza lo que tienes ahora.</p>
              </div>
              <div className="form-grid" style={{ marginTop: 10 }}>
                <input className="field" type="file" accept=".json,application/json" onChange={(e) => { setImportArchivo(e.target.files && e.target.files[0]); setImportListo(null); setImportMsg(''); }} />
                {importArchivo && (
                  <div className="monto-row">
                    <input className="field" type="password" placeholder="Contraseña del archivo" value={importPass} onChange={(e) => setImportPass(e.target.value)} />
                    <button className="btn-add small" onClick={leerImportacion}>Abrir</button>
                  </div>
                )}
                {importListo && (
                  <span className="confirm-group" style={{ justifyContent: 'flex-start' }}>
                    <span className="confirm-warning">¿Reemplazar tus datos actuales con este archivo{importListo.fecha ? ` (${formatFechaCorta(new Date(importListo.fecha))})` : ''}? No se puede deshacer.</span>
                    <button className="btn-add danger small" onClick={confirmarImportacion}>Sí, reemplazar</button>
                    <button className="icon-btn small" onClick={() => setImportListo(null)} aria-label="Cancelar"><Icon name="x" size={14} /></button>
                  </span>
                )}
                {importMsg && <p className="hint">{importMsg}</p>}
              </div>
            </div>
            {!user.local && (
              <div className="settings-row settings-col">
                <div className="settings-row-top">
                  <div>
                    <div className="settings-row-title">Respaldos automáticos</div>
                    <p className="meta-detail">Cada {RESPALDO_DIAS} días se guarda una copia de tus datos en tu cuenta. Se conservan los últimos {RESPALDOS_A_GUARDAR}.</p>
                  </div>
                  <button className="btn-add small" onClick={respaldoManual}>Respaldar ahora</button>
                </div>
                {respaldos.length > 0 && (
                  <ul className="ledger-list" style={{ marginTop: 6 }}>
                    {respaldos.map((r) => (
                      <li key={r.id} className="ledger-row">
                        <div className="row-desc">{formatFechaCorta(parseISODate(r.fecha))}</div>
                        <div className="row-actions">
                          {confirmingId === `resp__${r.id}` ? (
                            <span className="confirm-group">
                              <span className="confirm-warning">¿Volver a este respaldo? Reemplaza tus datos actuales.</span>
                              <button className="btn-add danger small" onClick={() => restaurarRespaldo(r)}>Sí, restaurar</button>
                              <button className="icon-btn small" onClick={() => setConfirmingId(null)} aria-label="Cancelar"><Icon name="x" size={14} /></button>
                            </span>
                          ) : (
                            <button className="link-toggle" onClick={() => setConfirmingId(`resp__${r.id}`)}>Restaurar</button>
                          )}
                        </div>
                      </li>
                    ))}
                  </ul>
                )}
                {respaldoMsg && <p className="hint" style={{ marginTop: 8 }}>{respaldoMsg}</p>}
              </div>
            )}
            <div className="settings-row">
              <div>
                <div className="settings-row-title">Borrar todos los datos</div>
                <p className="meta-detail">Elimina ingresos, gastos, cuotas, metas y tarjetas. No se puede deshacer.</p>
              </div>
              {confirmReset ? (
                <span className="confirm-group">
                  <button className="btn-add danger small" onClick={confirmResetAll}>Sí, borrar todo</button>
                  <button className="icon-btn small" onClick={() => setConfirmReset(false)} aria-label="Cancelar"><Icon name="x" size={14} /></button>
                </span>
              ) : (
                <button className="btn-add danger small" onClick={() => setConfirmReset(true)}>Borrar todo</button>
              )}
            </div>
          </div>
          </>
        )}
      </div>

      {!asistenteAbierto && (
        <button className="asis-fab" style={{ bottom: navHeight + 16 }} onClick={() => setAsistenteAbierto(true)} aria-label="Abrir asistente">
          <Icon name="sparkles" size={22} />
        </button>
      )}
      {asistenteAbierto && (
        <AsistentePanel data={data} onClose={() => setAsistenteAbierto(false)} bottomOffset={navHeight + 12} onRegistrar={registrarDesdeAsistente} />
      )}

      <nav className="tab-bar" ref={navRef}>
        <div className="tab-bar-inner">
          <button className={`tab-bar-btn ${view === 'inicio' ? 'active' : ''}`} onClick={() => setView('inicio')}>
            <Icon name="layoutDashboard" size={20} /><span>Inicio</span>
          </button>
          <button className={`tab-bar-btn ${view === 'tendencia' ? 'active' : ''}`} onClick={() => setView('tendencia')}>
            <Icon name="trendingUp" size={20} /><span>Tendencia</span>
          </button>
          <button className={`tab-bar-btn ${view === 'ahorro' ? 'active' : ''}`} onClick={() => setView('ahorro')}>
            <Icon name="piggyBank" size={20} /><span>Ahorro</span>
          </button>
          <button className={`tab-bar-btn ${view === 'tarjetas' ? 'active' : ''}`} onClick={() => setView('tarjetas')}>
            <Icon name="creditCard" size={20} /><span>Tarjetas</span>
          </button>
          <button className={`tab-bar-btn ${view === 'ajustes' ? 'active' : ''}`} onClick={() => setView('ajustes')}>
            <Icon name="settings" size={20} /><span>Ajustes</span>
          </button>
        </div>
      </nav>
    </div>
  );
}

/* ============================== RAÍZ (control de sesión) ============================== */
function Root() {
  const [user, setUser] = useState(undefined); // undefined = cargando, null = sin sesión
  const [mostrarLogin, setMostrarLogin] = useState(false);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => {
      // Si la app estuvo cerrada más de 15 minutos, la sesión guardada ya no vale.
      const ultima = parseInt(leerLS(ACTIVIDAD_KEY) || '0', 10);
      if (u && ultima && Date.now() - ultima > INACTIVIDAD_MS) { escribirLS(CIERRE_KEY, '1'); escribirLS(ACTIVIDAD_KEY, null); auth.signOut(); return; }
      // Sin sesión: se borra la marca, para que un inicio de sesión nuevo no se tome como "sesión vieja".
      escribirLS(ACTIVIDAD_KEY, u ? String(Date.now()) : null);
      setUser(u);
    });
    return unsub;
  }, []);

  // Cierre de sesión por inactividad (15 min). Cualquier toque, tecla o scroll reinicia el contador.
  useEffect(() => {
    if (!user) return;
    let ultimoRegistro = 0;
    const marcar = () => { const ahora = Date.now(); if (ahora - ultimoRegistro > 5000) { ultimoRegistro = ahora; escribirLS(ACTIVIDAD_KEY, String(ahora)); } };
    const revisar = () => {
      const ultima = parseInt(leerLS(ACTIVIDAD_KEY) || '0', 10) || ultimoRegistro;
      if (ultima && Date.now() - ultima > INACTIVIDAD_MS) { escribirLS(CIERRE_KEY, '1'); escribirLS(ACTIVIDAD_KEY, null); auth.signOut(); }
    };
    const eventos = ['pointerdown', 'keydown', 'scroll', 'touchstart', 'wheel'];
    eventos.forEach((ev) => window.addEventListener(ev, marcar, { passive: true, capture: true }));
    const alVolver = () => { if (document.visibilityState === 'visible') revisar(); };
    document.addEventListener('visibilitychange', alVolver);
    marcar();
    const id = setInterval(revisar, 30000);
    return () => { eventos.forEach((ev) => window.removeEventListener(ev, marcar, { capture: true })); document.removeEventListener('visibilitychange', alVolver); clearInterval(id); };
  }, [user]);

  if (user === undefined) {
    return (
      <div className="app-shell">
        <style>{STYLES}</style>
        <div className="loading-screen">Cargando…</div>
      </div>
    );
  }
  if (!user) {
    // Pantalla de inicio de sesión desactivada por ahora (ver REQUERIR_LOGIN arriba).
    if (REQUERIR_LOGIN || mostrarLogin) return <AuthScreen onVolver={REQUERIR_LOGIN ? null : () => setMostrarLogin(false)} />;
    return <ControlGastos key="local" user={USUARIO_LOCAL} onIrALogin={() => setMostrarLogin(true)} />;
  }
  // Cuentas con correo y contraseña deben verificar el correo (Google ya viene verificado).
  const usaPassword = (user.providerData || []).some((p) => p && p.providerId === 'password');
  if (usaPassword && !user.emailVerified) return <VerificarCorreo user={user} />;
  return <ControlGastos key={user.uid} user={user} />;
}

  flex:1; padding:4px 6px; border-radius:12px; cursor:pointer; transition: color 0.15s;
}
.tab-bar-btn.active { color:var(--accent); }
.tab-bar-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.link-btn { background:none; border:none; color:var(--text-secondary); font-size:12px; text-decoration:underline; cursor:pointer; }
.link-btn:hover { color:var(--silver); }
.privacidad-nota { font-size:11px; line-height:1.55; color:var(--text-secondary); text-align:justify; text-align-last:left; hyphens:auto; -webkit-hyphens:auto; margin:22px 0 0; opacity:0.85; }
.reset-confirm { display:flex; align-items:center; justify-content:center; gap:10px; font-size:12.5px; color:var(--negative); flex-wrap:wrap; }

/* ---------- Asistente ---------- */
.asis-fab {
  position:fixed; right:max(16px, calc(50% - 320px + 4px)); z-index:25;
  width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(135deg, #0A84FF, #5E5CE6); color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 24px rgba(10,132,255,0.45); transition:transform 0.15s;
}
.asis-fab:hover { transform:scale(1.06); }
.asis-fab:focus-visible { outline:2px solid #fff; outline-offset:3px; }
.asis-overlay { position:fixed; inset:0; z-index:30; background:rgba(3,10,20,0.45); }
.asis-panel {
  position:fixed; left:50%; transform:translateX(-50%);
  width:calc(100% - 24px); max-width:560px; top:max(16px, env(safe-area-inset-top, 0px));
  background:var(--surface); border:1px solid var(--border-strong); border-radius:20px;
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,0.5); animation: riseIn 0.2s ease both;
  -webkit-user-select:text; user-select:text;
}
.asis-header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
.asis-avatar { width:34px; height:34px; border-radius:11px; background:linear-gradient(135deg, #0A84FF, #5E5CE6); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.asis-title { font-weight:700; font-size:15px; }
.asis-sub { font-size:11.5px; color:var(--text-secondary); }
.asis-body { flex:1; overflow-y:auto; padding:14px 14px 6px; display:flex; flex-direction:column; gap:10px; }
.asis-msg { max-width:92%; font-size:13.5px; line-height:1.45; animation: fadeIn 0.25s ease both; }
.asis-msg.yo { align-self:flex-end; background:var(--accent); color:#fff; padding:9px 13px; border-radius:16px 16px 4px 16px; }
.asis-msg.bot { align-self:flex-start; background:var(--surface-2); padding:11px 13px; border-radius:16px 16px 16px 4px; width:92%; }
.asis-texto { margin:0; }
.asis-filas { list-style:none; margin:10px 0 0; padding:0; }
.asis-filas li { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--border); font-size:12.5px; }
.asis-filas li span:first-child { color:var(--text-secondary); min-width:0; display:flex; align-items:center; gap:6px; }
.asis-filas li span:last-child { font-variant-numeric:tabular-nums; font-weight:600; text-align:right; white-space:nowrap; }
.asis-filas li.fuerte span { color:var(--text); font-weight:700; font-size:13.5px; }
.asis-filas.compactas li { padding:5px 0; font-size:12px; }
.asis-filas li span.positive { color:var(--positive); }
.asis-filas li span.negative { color:var(--negative); }
.asis-filas li span.warning { color:#FFB340; }
.asis-dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
.asis-nota { font-size:11.5px; color:var(--text-secondary); margin-top:8px; }
.asis-bloque { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-top:10px; }
.asis-bloque-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.asis-bloque-titulo { font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:6px; }
.asis-bloque-titulo svg { color:#64D2FF; }
.asis-bloque-sub { font-size:11.5px; color:var(--text-secondary); margin-top:2px; }
.asis-monto { font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.warning { color:#FFB340; }
.asis-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.asis-chip { background:var(--accent-soft); color:#64B5FF; border:1px solid rgba(10,132,255,0.3); border-radius:14px; padding:6px 11px; font-size:12px; font-family:'Inter', sans-serif; font-weight:600; cursor:pointer; text-align:left; }
.asis-chip:hover { background:rgba(10,132,255,0.26); }
.asis-chip.small { white-space:nowrap; flex-shrink:0; padding:5px 10px; font-size:11.5px; }
.asis-quick { display:flex; gap:6px; overflow-x:auto; padding:8px 14px; border-top:1px solid var(--border); scrollbar-width:none; }
.asis-quick::-webkit-scrollbar { display:none; }
.asis-input-row { display:flex; gap:8px; padding:4px 14px 14px; }
.asis-input-row .field { flex:1; }
.asis-accion { background:var(--bg); border:1px solid var(--border-strong); border-radius:12px; padding:12px; margin-top:10px; }
.asis-accion.hecho { border-color:var(--border); }
.asis-accion-estado { font-weight:700; font-size:13px; margin-bottom:4px; color:var(--text-secondary); }
.asis-accion-estado.positive { color:var(--positive); }
.asis-accion-tipos { display:flex; gap:4px; background:var(--surface); padding:3px; border-radius:10px; margin-bottom:10px; }
.asis-tipo { flex:1; background:none; border:none; color:var(--text-secondary); font-family:'Inter', sans-serif; font-size:11.5px; font-weight:600; padding:7px 4px; border-radius:8px; cursor:pointer; }
.asis-tipo.active { background:var(--accent); color:#fff; }
.asis-accion-campos { display:flex; flex-direction:column; gap:8px; }
.asis-accion-campos label { display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--text-secondary); }
.asis-accion-campos .field { padding:8px 10px; font-size:13px; }
.asis-accion-campos .method-btn { padding:7px 4px; }
.asis-accion-botones { display:flex; gap:8px; margin-top:12px; }
.asis-accion-botones .btn-add { flex:1; padding:9px 12px; font-size:13px; }
.btn-sec { background:none; border:1px solid var(--border-strong); color:var(--text); border-radius:12px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:'Inter', sans-serif; }
.btn-sec:hover { background:rgba(255,255,255,0.06); }
.asis-send { width:44px; flex-shrink:0; border:none; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }

.loading-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--text-secondary); font-family:'Inter', sans-serif; }

@media (max-width: 480px) {
  .masthead { font-size:19px; }
  .card { padding:16px; }
  .amount-mono.big { font-size:23px; }
  .progress-track { width:90px; }
  .ledger-row { flex-direction:column; align-items:flex-start; }
  .row-actions { width:100%; justify-content:space-between; }
  .legend-pct { min-width:auto; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation:none !important; transition:none !important; }
}
`;
