function getIngresoMes(ingresos, monthK) {

function simularCuota(c) {

      } else {
        // Próxima fecha de pago; si ese estado ya está cubierto, muestra el siguiente que sí tenga saldo.
        mes = mesDeFecha(proximaFechaDia(t.diaPago));
        for (let i = 0; i < 3; i++) {
          if (getTotalTarjetaMes(t, data, mes) > 0.005) break;
          const sig = addMonths(mes, 1);
          if (getTotalTarjetaMes(t, data, sig) > 0.005) { mes = sig; break; }
          if (i === 2) mes = mesDeFecha(proximaFechaDia(t.diaPago));
          else mes = sig;
        }
      }
      const est = getEstadoTarjeta(t, data, mes);
      const fecha = aHoy ? est.fechaPago : fechaPagoDeMes(t, mes);
      const pendiente = est.pendiente;
      const pagado = est.pagadoCiclo;
      const detalle = getEntradasTarjetaMes(t, data, mes).map((e) => ({
        label: nombreEntrada(e) + (e.pagado >= e.monto - 0.005 && e.monto > 0 ? ' ✓' : ''),
        valor: formatQ(e.monto),
      }));
      if (est.pendienteAnterior > 0.005) detalle.unshift({ label: 'Pendiente de meses anteriores', valor: formatQ(est.pendienteAnterior) });
      if (est.favorAnterior > 0.005) detalle.unshift({ label: 'Saldo a favor anterior', valor: '-' + formatQ(est.favorAnterior) });
      if (est.pagosDelCiclo > 0.005) detalle.push({ label: 'Pagos registrados', valor: '-' + formatQ(est.pagosDelCiclo) });
      // Si se saltó un estado ya pagado, avisarlo.
      const mesProx = mesDeFecha(proximaFechaDia(t.diaPago));
      const saltado = !mesPedido && !aHoy && mes !== mesProx ? getEstadoTarjeta(t, data, mesProx) : null;
      return { t, fecha, pendiente, pagado, detalle, dias: diasHasta(fecha), aFavor: est.aFavor, saltado };
    }).sort((a, b) => a.fecha - b.fecha);
    const total = filas.reduce((a, f) => a + f.pendiente, 0);
    const bloques = filas.map((f) => ({
      titulo: f.t.nombre,
      subtitulo: aHoy ? `Saldo a hoy · próximo pago el ${formatFechaCorta(f.fecha)} (${textoDias(f.dias)})` : f.dias >= 0 ? `Pago el ${formatFechaCorta(f.fecha)} (${textoDias(f.dias)})` : `Venció el ${formatFechaCorta(f.fecha)}`,
      monto: f.pendiente,
      tono: f.pendiente <= 0 ? 'positive' : f.dias <= 3 ? 'negative' : 'warning',
      nota: f.pendiente <= 0
        ? (f.aFavor > 0.005 ? `Estás al día y tienes ${formatQ(f.aFavor)} a favor` : f.pagado > 0 ? `Ya pagaste ${formatQ(f.pagado)}. Estás al día` : 'No tienes nada pendiente para esa fecha')
        : (f.pagado > 0 ? `Ya abonaste ${formatQ(f.pagado)}; esto es lo que falta.` : null),
      alerta: f.saltado ? `El pago del ${formatFechaCorta(f.saltado.fechaPago)} ya está cubierto ✓, por eso te muestro el siguiente.` : null,
      detalle: f.pendiente > 0 ? f.detalle : [],
    }));
    const prox = filas[0];
    const unaTarjeta = filas.length === 1;
    let texto;
    if (aHoy) {
      texto = total > 0.005
        ? (unaTarjeta
            ? `A día de hoy debes ${formatQ(total)} en ${prox.t.nombre}. Tu próxima fecha de pago es el ${formatFechaCorta(prox.fecha)} (${textoDias(prox.dias)}).`
            : `A día de hoy debes ${formatQ(total)} entre tus tarjetas.`)
        : `A día de hoy tus tarjetas están en ${formatQ(0)} ✓. No tienes saldo pendiente.`;
      return { texto, bloques: bloques.map((b) => ({ ...b, nota: b.monto <= 0.005 ? 'Sin saldo pendiente' : b.nota })) };
    }
    if (mesPedido) {
      texto = total > 0
        ? `Para ${monthLabel(mesPedido)} debes ${formatQ(total)}${unaTarjeta ? ` en ${prox.t.nombre}, con pago el ${formatFechaCorta(prox.fecha)}` : ' entre tus tarjetas'}.`
        : `No tienes nada pendiente para ${monthLabel(mesPedido)}.`;
    } else {
      texto = total > 0
        ? (unaTarjeta
            ? `Tu próximo pago de ${prox.t.nombre} es de ${formatQ(total)}, el ${formatFechaCorta(prox.fecha)} (${textoDias(prox.dias)}).`
            : `En total tienes ${formatQ(total)} pendientes en tus tarjetas. La más cercana es ${prox.t.nombre}, ${textoDias(prox.dias)}.`)
        : 'No tienes pagos pendientes en tus tarjetas por ahora.';
    }
    return {
      texto,
      bloques,
    };
  }

  if (intencion === 'desglose') {
    if (data.tarjetas.length === 0) return { texto: 'No tienes tarjetas registradas.' };
    const hoyStr = hoyISO();
    const fechaQ = detectarFechaConsulta(textoOriginal || '');
    const mesP = detectarMes(textoOriginal || '');
    const iso = fechaQ || (mesP && mesP !== mesHoy ? isoDeMes(mesP, 31) : hoyStr);
    const mesRef = iso.slice(0, 7);
    const tarjetasSel = detectarTarjetas(textoOriginal || '', data.tarjetas);
    const porTarjeta = tarjetasSel.map((t) => ({ t, d: getDeudaPorMes(t, data, iso) }));
    const total = redondear(porTarjeta.reduce((a, x) => a + x.d.total, 0));
    const meses = {};
    porTarjeta.forEach((x) => Object.entries(x.d.porMes).forEach(([m, v]) => { meses[m] = redondear((meses[m] || 0) + v); }));
    const orden = Object.keys(meses).sort();
    const atrasado = redondear(orden.filter((m) => m < mesRef).reduce((a, m) => a + meses[m], 0));
    const delMes = redondear(meses[mesRef] || 0);
    const cuando = iso === hoyStr ? 'hoy' : `al ${formatFechaCorta(parseISODate(iso))}`;
    if (total <= 0.005) return { texto: `No debes nada ${cuando}${tarjetasSel.length === 1 ? ` en ${tarjetasSel[0].nombre}` : ''} ✓, así que no hay nada atrasado.` };
    const texto = atrasado <= 0.005
      ? `Los ${formatQ(total)} que debes ${cuando} son solo de ${monthLabel(mesRef)}. No tienes nada atrasado de meses anteriores ✓.`
      : delMes <= 0.005
        ? `Los ${formatQ(total)} que debes ${cuando} son todos de meses anteriores (atrasados).`
        : `De los ${formatQ(total)} que debes ${cuando}, ${formatQ(delMes)} son de ${monthLabel(mesRef)} y ${formatQ(atrasado)} vienen de meses anteriores.`;
    return {
      texto,
      filas: [
        ...orden.map((m) => ({ label: `${monthLabel(m)}${m < mesRef ? ' (atrasado)' : ''}`, valor: formatQ(meses[m]), tono: m < mesRef ? 'negative' : null })),
        { label: 'Total', valor: formatQ(total), fuerte: true },
      ],
      bloques: porTarjeta.filter((x) => x.d.total > 0.005).map((x) => ({
        titulo: x.t.nombre, subtitulo: `Lo que falta pagar, por compra`, monto: x.d.total, tono: 'warning', nota: null, alerta: null,
        detalle: Object.keys(x.d.items).sort().flatMap((m) => x.d.items[m]),
      })),
    };
  }

  if (intencion === 'proximo_corte') {
    if (data.tarjetas.length === 0) return { texto: 'No tienes tarjetas registradas todavía.' };
    const filas = data.tarjetas.map((t) => {
      const corte = proximaFechaDia(t.diaCorte);
      const ciclo = calcularCicloTC(`${corte.getFullYear()}-${String(corte.getMonth() + 1).padStart(2, '0')}-${String(corte.getDate()).padStart(2, '0')}`, t.diaCorte, t.diaPago);
      return { t, corte, pago: ciclo.fechaPago, dias: diasHasta(corte) };
    }).sort((a, b) => a.corte - b.corte);
    const p = filas[0];
    return {
      texto: `Tu próximo corte es de ${p.t.nombre}, ${textoDias(p.dias)}. Lo que compres con esa tarjeta después del corte se paga hasta el siguiente ciclo.`,
      filas: filas.map((f) => ({ label: f.t.nombre, valor: `Corte ${formatFechaCorta(f.corte)} → pago ${formatFechaCorta(f.pago)}` })),
    };
  }

  if (intencion === 'saldo') {
    const r = resumenMes(data, mesQ);
    if (r.ingreso <= 0) return { texto: `No tienes ingreso registrado para ${lblQ}. Anótalo en Inicio (quincenas) para que pueda calcular tu saldo.` };
    const dia = new Date().getDate();
    const diasRestantes = diasEnMes(new Date().getFullYear(), new Date().getMonth() + 1) - dia + 1;
    const esActual = mesQ === mesHoy;
    return {
      texto: r.saldo >= 0
        ? (esActual ? `Te quedan ${formatQ(r.saldo)} en ${lblQ}. Eso es aprox. ${formatQ(r.saldo / diasRestantes)} por día para lo que resta del mes.` : `En ${lblQ} te quedarían ${formatQ(r.saldo)} según lo registrado.`)
        : `Vas ${formatQ(Math.abs(r.saldo))} por encima de tu ingreso en ${lblQ}.`,
      filas: [
        { label: 'Ingreso', valor: formatQ(r.ingreso) },
        { label: 'Gastos', valor: '-' + formatQ(r.gastos), tono: 'negative' },
        { label: 'Ahorro apartado', valor: '-' + formatQ(r.aportes), tono: 'negative' },
        { label: 'Saldo', valor: formatQ(r.saldo), tono: r.saldo >= 0 ? 'positive' : 'negative', fuerte: true },
      ],
    };
  }

  if (intencion === 'gastado') {
    const r = resumenMes(data, mesQ);
    const prev = resumenMes(data, addMonths(mesQ, -1));
    const pct = r.ingreso > 0 ? (r.gastos / r.ingreso) * 100 : null;
    const dif = r.gastos - prev.gastos;
    return {
      texto: `En ${lblQ} llevas ${formatQ(r.gastos)} en gastos${pct !== null ? ` (${pct.toFixed(0)}% de tu ingreso)` : ''}.`,
      filas: [
        { label: lblQ, valor: formatQ(r.gastos) },
        { label: monthLabel(addMonths(mesQ, -1)), valor: formatQ(prev.gastos) },
        { label: 'Diferencia', valor: (dif > 0 ? '▲ ' : dif < 0 ? '▼ ' : '') + formatQ(Math.abs(dif)), tono: dif > 0 ? 'negative' : 'positive' },
      ],
      nota: 'Las compras con tarjeta cuentan cuando registras el pago de la tarjeta.',
    };
  }

  if (intencion === 'categorias') {
    const cats = categoriasMes(data, mesQ);
    if (cats.length === 0) return { texto: `Aún no hay gastos registrados en ${lblQ}.` };
    const total = cats.reduce((a, c) => a + c.total, 0);
    const prevMap = Object.fromEntries(categoriasMes(data, addMonths(mesQ, -1)).map((c) => [c.id, c.total]));
    return {
      texto: `Tu mayor gasto en ${lblQ} es ${catLabel(cats[0].id)}: ${formatQ(cats[0].total)} (${((cats[0].total / total) * 100).toFixed(0)}% del total).`,
      filas: cats.slice(0, 5).map((c) => {
        const p = prevMap[c.id] || 0;
        const flecha = p === 0 ? '' : c.total > p ? ' ▲' : c.total < p ? ' ▼' : '';
        return { label: catLabel(c.id), valor: formatQ(c.total) + flecha, color: catColor(c.id) };
      }),
      nota: '▲▼ comparado con el mes anterior.',
    };
  }

  if (intencion === 'cuotas') {
    const activas = getCuotasActivas(data.cuotas, mesQ);
    const compromisos = data.cuotas.map((c) => ({ c, ...getCompromiso(c, mesQ) }));
    const deudaTotal = compromisos.reduce((a, x) => a + x.montoRestante, 0) + activas.reduce((a, c) => a + c.montoCuota, 0);
    if (activas.length === 0 && deudaTotal <= 0) return { texto: 'No tienes cuotas activas.' };
    const esteMes = activas.reduce((a, c) => a + c.montoCuota, 0);
    const terminan = activas.filter((c) => getCompromiso(c, mesQ).restantes === 0);
    return {
      texto: `En ${lblQ} pagas ${formatQ(esteMes)} en cuotas y te quedan ${formatQ(deudaTotal)} por pagar en total (incluyendo ese mes).`,
      filas: activas.map((c) => {
        const comp = getCompromiso(c, mesQ);
        return { label: `${c.descripcion} · ${c.cuotaActual}/${c.numCuotas}`, valor: `${formatQ(c.montoCuota)} · faltan ${comp.restantes}` };
      }),
      nota: terminan.length > 0 ? ` En ${lblQ} terminas: ${terminan.map((c) => c.descripcion).join(', ')}.` : null,
    };
  }

  if (intencion === 'fijos') {
    const hoy = hoyMedianoche();
    const proximos = data.gastosFijos
      .filter((f) => addMonths(mesHoy, 1) >= f.mesInicio)
      .map((f) => {
        const fecha = proximaFechaDia(f.dia || 1);
        return { f, fecha, dias: diasHasta(fecha) };
      })
      .filter((x) => x.fecha >= hoy && x.dias <= 31 && mesDeFecha(x.fecha) >= x.f.mesInicio)
      .sort((a, b) => a.fecha - b.fecha);
    if (proximos.length === 0) return { texto: 'No tienes gastos fijos registrados.' };
    const semana = proximos.filter((x) => x.dias <= 7);
    return {
      texto: semana.length > 0
        ? `En los próximos 7 días se cobran ${semana.length} gasto(s) fijo(s) por ${formatQ(semana.reduce((a, x) => a + x.f.monto, 0))}.`
        : 'No hay gastos fijos en los próximos 7 días. Estos son los que siguen:',
      filas: proximos.slice(0, 8).map((x) => ({
        label: `${x.f.descripcion} · ${textoDias(x.dias)}`,
        valor: formatQ(x.f.monto) + (x.f.metodoPago === 'tarjeta' ? '' : ''),
        tono: x.dias <= 3 ? 'warning' : null,
      })),
    };
  }

  if (intencion === 'metas') {
    if (data.metas.length === 0) return { texto: 'No tienes metas de ahorro todavía. Créalas en la pestaña Ahorro.' };
    return {
      texto: `Llevas ${formatQ(data.metas.reduce((a, m) => a + getTotalAportado(m), 0))} ahorrados en ${data.metas.length} meta(s).`,
      filas: data.metas.map((m) => {
        const p = getMetaProgreso(m);
        let extra = '';
        if (p.completada) extra = '';
        else if (m.mesLimite) {
          const meses = monthsBetween(mesHoy, m.mesLimite) + 1;
          extra = meses > 0 ? ` · ${formatQ(p.restante / meses)}/mes` : ' · vencida';
        }
        return { label: `${m.descripcion} (${p.pct.toFixed(0)}%)`, valor: `${formatQ(p.totalAportado)} de ${formatQ(m.montoMeta)}${extra}` };
      }),
      nota: 'El monto /mes es lo que necesitas aportar cada mes para llegar a tiempo.',
    };
  }

  if (intencion === 'alcanza') {
    const monto = extraerMonto(textoOriginal);
    const r = resumenMes(data, mesHoy);
    if (!monto) return { texto: `Dime el monto, por ejemplo: "¿Me alcanza para Q800?". Ahora mismo te quedan ${formatQ(r.saldo)} este mes.` };
    const tarjetasPend = data.tarjetas.reduce((a, t) => {
      const f = proximaFechaDia(t.diaPago);
      // Lo que aún falta pagar de tarjetas que vencen este mes (ya descuenta pagos registrados).
      return mesDeFecha(f) === mesHoy ? a + getTotalTarjetaMes(t, data, mesHoy) : a;
    }, 0);
    // Gastos fijos (efectivo/débito) que aún no se cobran este mes.
    const hoyStr = hoyISO();
    const fijosPend = data.gastosFijos
      .filter((f) => f.metodoPago !== 'tarjeta' && mesHoy >= f.mesInicio && `${mesHoy}-${String(f.dia || 1).padStart(2, '0')}` > hoyStr)
      .reduce((a, f) => a + f.monto, 0);
    const disponibleReal = r.saldo - tarjetasPend - fijosPend;
    const queda = disponibleReal - monto;
    return {
      texto: queda >= 0
        ? `Sí te alcanza. Después de gastar ${formatQ(monto)} te quedarían ${formatQ(queda)} este mes.`
        : `No te alcanza este mes: te faltarían ${formatQ(Math.abs(queda))}.`,
      filas: [
        { label: 'Saldo del mes', valor: formatQ(r.saldo) },
        ...(tarjetasPend > 0 ? [{ label: 'Pagos de tarjeta pendientes este mes', valor: '-' + formatQ(tarjetasPend), tono: 'negative' }] : []),
        ...(fijosPend > 0 ? [{ label: 'Gastos fijos que faltan este mes', valor: '-' + formatQ(fijosPend), tono: 'negative' }] : []),
        { label: 'Compra', valor: '-' + formatQ(monto), tono: 'negative' },
        { label: 'Te quedaría', valor: formatQ(queda), tono: queda >= 0 ? 'positive' : 'negative', fuerte: true },
      ],
    };
  }

  return {
    texto: 'No entendí esa pregunta. Prueba con alguna de estas:',
    sugerencias: true,
  };
}

/* ---------- Asistente: registrar gastos, gastos fijos y pagos (con confirmación) ---------- */
const VERBOS_IMPERATIVOS = /\b(registra|registrar|registrame|anota|anotar|anotame|agrega|agregar|agregame|apunta|apuntar|anade|anadir|guarda|guardar|ingresa|ingresar)\b/;
const VERBOS_PASADO = /\b(pague|abone|compre|gaste|me cobraron|me cobro)\b/;
const PALABRAS_PREGUNTA = /\b(cuanto|cuanta|cuantos|que|cual|como|cuando|donde|alcanza)\b/;
function esAccionRegistrar(texto) {
  const t = normalizarTexto(texto);
  if (VERBOS_IMPERATIVOS.test(t)) return true;
  return VERBOS_PASADO.test(t) && !PALABRAS_PREGUNTA.test(t) && !/\bsi\b/.test(t);
}
function parseFechaTexto(texto) {
  // Devuelve una fecha ISO: "hoy", "ayer", "antier", "el 10", "10 de octubre", "10/10", "10/10/2026". Por defecto hoy.
  const t = normalizarTexto(texto);
  const hoy = hoyMedianoche();
  if (/\b(antier|anteayer)\b/.test(t)) return isoDeFecha(new Date(hoy.getTime() - 2 * 86400000));
  if (/\bayer\b/.test(t)) return isoDeFecha(new Date(hoy.getTime() - 86400000));
  let m = t.match(new RegExp('\\b(\\d{1,2})\\s+de\\s+' + MESES_REGEX + '(\\s+(de\\s+)?(20\\d\\d))?'));
  if (m) {
    const mesIdx = m[2] === 'setiembre' ? 8 : MESES.map((x) => normalizarTexto(x).trim()).indexOf(m[2]);
    const y = m[5] ? parseInt(m[5], 10) : hoy.getFullYear();
    return isoDe(y, mesIdx + 1, parseInt(m[1], 10));
  }
  m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if (m) {
    let y = m[3] ? parseInt(m[3], 10) : hoy.getFullYear();
    if (y < 100) y += 2000;
    return isoDe(y, parseInt(m[2], 10), parseInt(m[1], 10));
  }
  m = t.match(/\b(?:el|dia)\s+(\d{1,2})\b(?!\s*(?:de\s+)?(?:q|quetzales|dolares|\$))/);
  if (m) return isoDe(hoy.getFullYear(), hoy.getMonth() + 1, parseInt(m[1], 10));
  return isoDeFecha(hoy);
}
function quitarFechas(texto) {
  return (texto || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(new RegExp('\\b\\d{1,2}\\s+de\\s+' + MESES_REGEX + '(\\s+(de\\s+)?20\\d\\d)?', 'g'), ' ')
    .replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g, ' ')
    .replace(/\b(el|dia)\s+\d{1,2}\b(?!\s*(de\s+)?(q|quetzales|dolares|\$))/g, ' ')
    .replace(/\b(cada|los)\s+\d{1,2}\b/g, ' ');
}
function borradorDesdeTexto(texto, data, tipoForzado) {
  const t = normalizarTexto(texto);
  const sinFechas = quitarFechas(texto);
  const monto = extraerMonto(sinFechas);
  const esUSD = /\$|\bdolar|\busd\b/.test((texto || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''));
  const tarjetaNombrada = data.tarjetas.find((x) => normalizarTexto(x.nombre).trim() && (' ' + t + ' ').includes(' ' + normalizarTexto(x.nombre).trim() + ' '));
  const mencionaTarjeta = !!tarjetaNombrada || /\b(tarjeta|credito|tc)\b/.test(t);
  const unicaTarjeta = data.tarjetas.length === 1 ? data.tarjetas[0] : null;
  let tipo = tipoForzado;
  if (!tipo) {
    if (/\b(fijo|cada mes|mensual|mensualmente|suscripcion)\b/.test(t)) tipo = 'fijo';
    else if (/\b(pague|pago|abone|abono)\b/.test(t) && mencionaTarjeta && !/\b(compre|gaste|compra|gasto)\b/.test(t)
             && /\b(pago|pague|abone|abono)\s+(de\s+)?(q|\$)?\s?[\d.,]*\s*(a|al|en)\s+(la\s+|mi\s+)?(tarjeta|credito|tc|\w+)/.test(t)) tipo = 'pago';
    else tipo = 'gasto';
  }
  let metodo = 'debito';
  if (/\befectivo\b/.test(t)) metodo = 'efectivo';
  else if (/\bdebito\b/.test(t)) metodo = 'debito';
  else if (mencionaTarjeta) metodo = 'tarjeta';
  // Descripción: lo que queda al quitar verbos, montos, fechas, medios de pago y palabras de relleno.
  const nombresTarjetas = data.tarjetas.map((x) => normalizarTexto(x.nombre).trim()).filter(Boolean);
  let desc = normalizarTexto(sinFechas)
    .replace(VERBOS_IMPERATIVOS, ' ').replace(VERBOS_PASADO, ' ')
    .replace(/(q|\$|us\$)?\s?\d[\d.,]*/g, ' ')
    .replace(/\b(quetzales?|dolares?|usd|efectivo|debito|credito|tarjeta|tc|con|hoy|ayer|antier|anteayer|fijo|cada|mes|mensual|mensualmente|suscripcion|dia|gasto|gastos|compra|compras|pago|un|una|unos|unas|el|la|los|las|de|del|en|por|para|a|al|mi|me|que|y|se|lo|le)\b/g, ' ');
  nombresTarjetas.forEach((n) => { desc = desc.replace(new RegExp('\\b' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g'), ' '); });
  desc = desc.replace(/\s+/g, ' ').trim();
  desc = desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : '';
  const fecha = parseFechaTexto(texto);
  const diaFijo = (() => { const m = t.match(/\b(?:el|dia|los|cada)\s+(\d{1,2})\b/); return m ? Math.min(parseInt(m[1], 10), 31) : parseISODate(fecha).getDate(); })();
  return {
    tipo,
    descripcion: desc,
    monto: monto ? String(monto) : '',
    moneda: esUSD ? 'USD' : 'GTQ',
    fecha,
    categoria: detectarCategoria(texto) || detectarCategoria(desc) || 'otros',
    metodo,
    tarjetaId: (tarjetaNombrada || (mencionaTarjeta || tipo === 'pago' ? unicaTarjeta : null) || {}).id || '',
    dia: String(diaFijo),
    mesInicio: detectarMes(texto) || fecha.slice(0, 7),
  };
}
function AccionCard({ accion, data, onConfirmar }) {
  const [d, setD] = useState(accion.borrador);
  const [estado, setEstado] = useState('pendiente'); // pendiente | hecho | cancelado
  const [resumen, setResumen] = useState('');
  const set = (k, v) => setD((prev) => ({ ...prev, [k]: v }));
  const tc = data.tipoCambio || TIPO_CAMBIO_DEFAULT;
  const montoNum = parseFloat(String(d.monto).replace(/,/g, ''));
  const montoQ = d.moneda === 'USD' ? montoNum * tc : montoNum;
  const necesitaTarjeta = d.tipo === 'pago' || d.metodo === 'tarjeta';
  const faltan = [];
  if (!(montoNum > 0)) faltan.push('monto');
  if (d.tipo !== 'pago' && !d.descripcion.trim()) faltan.push('descripción');
  if (necesitaTarjeta && !d.tarjetaId) faltan.push('tarjeta');
  if (d.tipo !== 'fijo' && !d.fecha) faltan.push('fecha');

  function confirmar() {
    if (faltan.length) return;
    onConfirmar({ ...d, monto: montoNum });
    const tarjeta = (data.tarjetas.find((x) => x.id === d.tarjetaId) || {}).nombre;
    const medio = d.metodo === 'tarjeta' ? `con ${tarjeta}` : d.metodo === 'efectivo' ? 'en efectivo' : 'con débito';
    if (d.tipo === 'pago') setResumen(`Registré un pago de ${formatQ(montoQ)} a ${tarjeta} el ${formatFechaCorta(parseISODate(d.fecha))}.`);
    else if (d.tipo === 'fijo') setResumen(`Registré el gasto fijo "${d.descripcion.trim()}" de ${formatQ(montoQ)} al mes, el día ${d.dia}, ${medio}, desde ${monthLabel(d.mesInicio)}.`);
    else setResumen(`Registré "${d.descripcion.trim()}" por ${formatQ(montoQ)} ${medio} el ${formatFechaCorta(parseISODate(d.fecha))}.`);
    setEstado('hecho');
  }

  if (estado === 'hecho') return <div className="asis-accion hecho"><div className="asis-accion-estado positive">Registrado</div><p className="asis-texto">{resumen}</p></div>;
  if (estado === 'cancelado') return <div className="asis-accion hecho"><div className="asis-accion-estado">Cancelado. No se registró nada.</div></div>;

  return (
    <div className="asis-accion">
      <div className="asis-accion-tipos">

          <button key={id} type="button" className={`asis-tipo ${d.tipo === id ? 'active' : ''}`} onClick={() => set('tipo', id)}>{lbl}</button>
        ))}
      </div>
      <div className="asis-accion-campos">
        {d.tipo !== 'pago' && (
          <label>Descripción<input className="field" value={d.descripcion} placeholder="Ej. Almuerzo" onChange={(e) => set('descripcion', e.target.value)} /></label>
        )}
        <label>Monto
          <div className="monto-row">
            <input className="field" type="number" step="0.01" min="0" value={d.monto} placeholder="0.00" onChange={(e) => set('monto', e.target.value)} />
            <div className="currency-toggle">
              <button type="button" className={`currency-btn ${d.moneda === 'GTQ' ? 'active' : ''}`} onClick={() => set('moneda', 'GTQ')}>Q</button>
              <button type="button" className={`currency-btn ${d.moneda === 'USD' ? 'active' : ''}`} onClick={() => set('moneda', 'USD')}>$</button>
            </div>
          </div>
        </label>
        {d.moneda === 'USD' && montoNum > 0 && <p className="hint">≈ {formatQ(montoQ)} a $1 = {formatQ(tc)}</p>}
        {d.tipo !== 'pago' && (
          <label>Categoría
            <select className="field" value={d.categoria} onChange={(e) => set('categoria', e.target.value)}>
              {CATEGORIAS.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
            </select>
          </label>
        )}
        {d.tipo !== 'pago' && (
          <label>Método de pago
            <div className="method-toggle">
              {METODOS_PAGO.map((m) => (
                <button key={m.id} type="button" className={`method-btn ${d.metodo === m.id ? 'active' : ''}`} onClick={() => set('metodo', m.id)}>
                  <Icon name={m.icon} size={13} /><span>{m.label}</span>
                </button>
              ))}
            </div>
          </label>
        )}
        {necesitaTarjeta && (
          <label>Tarjeta
            <select className="field" value={d.tarjetaId} onChange={(e) => set('tarjetaId', e.target.value)}>
              <option value="">Selecciona una tarjeta</option>
              {data.tarjetas.map((x) => <option key={x.id} value={x.id}>{x.nombre}</option>)}
            </select>
          </label>
        )}
        {d.tipo === 'fijo' ? (
          <div className="monto-row">
            <label style={{ flex: 1 }}>Día de cobro<input className="field" type="number" min="1" max="31" value={d.dia} onChange={(e) => set('dia', e.target.value)} /></label>
            <label style={{ flex: 1 }}>Desde<input className="field" type="month" value={d.mesInicio} onChange={(e) => set('mesInicio', e.target.value)} /></label>
          </div>
        ) : (
          <label>Fecha<input className="field" type="date" value={d.fecha} onChange={(e) => set('fecha', e.target.value)} /></label>
        )}
        {necesitaTarjeta && d.tarjetaId && d.tipo === 'gasto' && d.fecha && (() => {
          const t = data.tarjetas.find((x) => x.id === d.tarjetaId);
          const c = calcularCicloTC(d.fecha, t.diaCorte, t.diaPago);
          return <p className="hint">Corte {formatFechaCorta(c.fechaCorte)} · se paga el {formatFechaCorta(c.fechaPago)}</p>;
        })()}
        {d.tipo === 'pago' && (
          <label className="check-externo" style={{ flexDirection: 'row' }}>
            <input type="checkbox" checked={!!d.externo} onChange={(e) => { set('externo', e.target.checked); if (e.target.checked && !d.montoExterno) set('montoExterno', d.monto); }} />
            <span>Una parte es de compras que no registré en la app</span>
          </label>
        )}
        {d.tipo === 'pago' && d.externo && (
          <label>¿Cuánto de este pago fue de esas compras?<input className="field" type="number" step="0.01" min="0" value={d.montoExterno || ''} onChange={(e) => set('montoExterno', e.target.value)} /></label>
        )}
        {d.tipo === 'pago' && d.tarjetaId && (() => {
          const t = data.tarjetas.find((x) => x.id === d.tarjetaId);
          const mes = mesObjetivoTarjeta(t, data, null);
          const e = getEstadoTarjeta(t, data, mes);
          const extN = d.externo ? Math.min(parseFloat(d.montoExterno) || montoNum || 0, montoNum || 0) : 0;
          const efectivo = (montoNum - extN) * (d.moneda === 'USD' ? tc : 1);
          return <p className="hint">Debes {formatQ(e.pendiente)} para el {formatFechaCorta(e.fechaPago)}{montoNum > 0 ? ` · después del pago: ${formatQ(Math.max(e.pendiente - efectivo, 0))}${efectivo > e.pendiente ? ` (${formatQ(efectivo - e.pendiente)} a favor)` : ''}` : ''}</p>;
        })()}
      </div>
      {faltan.length > 0 && <p className="asis-nota warning">Falta: {faltan.join(', ')}.</p>}
      <div className="asis-accion-botones">
        <button type="button" className="btn-add" disabled={faltan.length > 0} onClick={confirmar}><Icon name="check" size={15} /> Confirmar</button>
        <button type="button" className="btn-sec" onClick={() => setEstado('cancelado')}>Cancelar</button>
      </div>
    </div>
  );
}

function AsistentePanel({ data, onClose, bottomOffset, onRegistrar }) {
  const [mensajes, setMensajes] = useState([
    { de: 'bot', respuesta: { texto: '¡Hola! Soy el asistente de CoinPocket. Pregúntame sobre tus tarjetas, gastos, cuotas, ingresos o metas. Puedes decir un mes ("¿cuánto debo en diciembre?"), buscar un gasto por nombre ("¿cuánto pago de Claude?") y seguir con "¿y para enero?".', sugerencias: true } },
  ]);
  const [texto, setTexto] = useState('');
  const finRef = useRef(null);
  useEffect(() => { if (finRef.current) finRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, [mensajes]);

  const contextoRef = useRef({ intencion: null, texto: '' });
  function preguntar(pregunta, intencionForzada) {
    let intencion = intencionForzada || detectarIntencion(pregunta, data);
    let textoParaResponder = pregunta;
    const ctx = contextoRef.current;
    const tn = normalizarTexto(pregunta).trim();
    const esSeguimiento = /^(y|e|entonces|y que tal|y en|y para|y el|y la|y de)\b/.test(tn) || tn.split(/\s+/).length <= 3;
    // Pregunta de seguimiento ("y para diciembre?", "y en BAC?"): reutiliza el tema anterior.
    if (!intencionForzada && ctx.intencion && esSeguimiento && !intencion) {
      intencion = ctx.intencion;
      // Conserva lo que se buscaba (nombre del gasto, categoría, tarjeta) pero con el mes/monto nuevos.
      const sinMeses = normalizarTexto(ctx.texto)
        .replace(new RegExp('\\b(' + MESES.map((m) => normalizarTexto(m).trim()).join('|') + ')\\b', 'g'), ' ')
        .replace(/(este|proximo|siguiente|otro) mes|mes que viene|20\d\d|\d+(\.\d+)?/g, ' ');
      textoParaResponder = sinMeses + ' ' + pregunta;
    }
    if (intencion === 'desglose' && !intencionForzada) {
      // "¿Ese monto es solo de octubre o de meses atrasados?" → desglosa lo que se preguntó antes.
      textoParaResponder = ctx.intencion && ctx.intencion !== 'desglose' ? ctx.texto : (ctx.textoBase || ctx.texto || pregunta);
    }
    const meses = intencion === 'desglose' ? [] : detectarMeses(textoParaResponder);
    const MES_A_MES = ['saldo', 'gastado', 'categorias', 'categoria', 'mayor', 'cuotas', 'ingreso', 'resumen', 'buscar', 'pagos_realizados', 'dolares'];
    let respuestas;
    if (meses.length > 1 && MES_A_MES.includes(intencion)) {
      // Varias preguntas en una ("octubre y noviembre"): una respuesta por mes.
      respuestas = meses.slice(0, 6).map((mes) => ({ de: 'bot', respuesta: responderAsistente(intencion, data, textoConMes(textoParaResponder, mes)) }));
    } else {
      respuestas = [{ de: 'bot', respuesta: responderAsistente(intencion, data, textoParaResponder) }];
    }
    if (intencion && !['saludo', 'gracias', 'ayuda', 'registrar', 'desglose'].includes(intencion)) contextoRef.current = { intencion, texto: textoParaResponder };
    setMensajes((m) => [...m, { de: 'yo', texto: pregunta }, ...respuestas]);
  }
  function enviar() {
    const t = texto.trim();
    if (!t) return;
    preguntar(t);
    setTexto('');
  }

  return (
    <div className="asis-overlay" onClick={onClose}>
      <div className="asis-panel" style={{ bottom: bottomOffset }} onClick={(e) => e.stopPropagation()}>
        <div className="asis-header">
          <span className="asis-avatar"><Icon name="sparkles" size={18} /></span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="asis-title">Asistente</div>
          </div>
          <button className="icon-btn" onClick={onClose} aria-label="Cerrar asistente"><Icon name="x" size={18} /></button>
        </div>

        <div className="asis-body">
          {mensajes.map((m, i) => m.de === 'yo' ? (
            <div key={i} className="asis-msg yo">{m.texto}</div>
          ) : (
            <div key={i} className="asis-msg bot">
              <p className="asis-texto">{m.respuesta.texto}</p>
              {m.respuesta.accion && <AccionCard accion={m.respuesta.accion} data={data} onConfirmar={onRegistrar} />}
              {m.respuesta.filas && m.respuesta.filas.length > 0 && (
                <ul className="asis-filas">
                  {m.respuesta.filas.map((f, k) => (
                    <li key={k} className={f.fuerte ? 'fuerte' : ''}>
                      <span>{f.color && <i className="asis-dot" style={{ background: f.color }} />}{f.label}</span>
                      <span className={f.tono || ''}>{f.valor}</span>
                    </li>
                  ))}
                </ul>
              )}
              {m.respuesta.bloques && m.respuesta.bloques.map((b, j) => (
                <div key={j} className="asis-bloque">
                  <div className="asis-bloque-head">
                    <div style={{ minWidth: 0 }}>
                      <div className="asis-bloque-titulo"><Icon name="creditCard" size={14} /> {b.titulo}</div>
                      {b.subtitulo && <div className="asis-bloque-sub">{b.subtitulo}</div>}
                    </div>
                    <span className={`asis-monto ${b.tono}`}>{formatQ(b.monto)}</span>
                  </div>
                  {b.detalle.length > 0 && (
                    <ul className="asis-filas compactas">
                      {b.detalle.map((d, k) => <li key={k}><span>{d.label}</span><span>{d.valor}</span></li>)}
                    </ul>
                  )}
                  {b.nota && <div className="asis-nota">{b.nota}</div>}
                  {b.alerta && <div className="asis-nota warning">{b.alerta}</div>}
                </div>
              ))}
              {m.respuesta.nota && <div className="asis-nota">{m.respuesta.nota}</div>}
              {m.respuesta.sugerencias && (
                <div className="asis-chips">
                  {PREGUNTAS_ASISTENTE.map((p) => (
                    <button key={p.label} className="asis-chip" onClick={() => preguntar(p.label, p.id === 'alcanza' ? null : p.id)}>{p.label}</button>
                  ))}
                </div>
              )}
            </div>
          ))}
          <div ref={finRef} />
        </div>

        <div className="asis-quick">
          {PREGUNTAS_ASISTENTE.slice(0, 6).map((p) => (
            <button key={p.label} className="asis-chip small" onClick={() => preguntar(p.label, p.id)}>{p.label.replace(/[¿?]/g, '')}</button>
          ))}
        </div>
        <div className="asis-input-row">
          <input className="field" placeholder="Escribe tu pregunta…" value={texto}
                 onChange={(e) => setTexto(e.target.value)}
                 onKeyDown={(e) => { if (e.key === 'Enter') enviar(); }} />
          <button className="asis-send" onClick={enviar} aria-label="Enviar"><Icon name="send" size={18} /></button>
        </div>
      </div>
    </div>
  );
}

function DonutChart({ data, size = 200, strokeWidth = 22 }) {
  const total = data.reduce((sum, d) => sum + d.total, 0);
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  let cumulative = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <g transform={`rotate(-90 ${size / 2} ${size / 2})`}>
        {total === 0 ? (
          <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth={strokeWidth} />
        ) : data.map((d) => {
          const frac = d.total / total;
          const dash = frac * circumference;
          const offset = -(cumulative * circumference);
          cumulative += frac;
          return (
            <circle key={d.id} cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={d.color}
                    strokeWidth={strokeWidth} strokeDasharray={`${dash} ${circumference - dash}`} strokeDashoffset={offset} />
          );
        })}
      </g>
    </svg>
  );
}
function TrendBarChart({ data, currentMonth, height = 160 }) {
  const max = Math.max(...data.map((d) => d.total), 1);
  return (
    <div className="trend-bars" style={{ height }}>
      {data.map((d) => (
        <div key={d.mes} className="trend-bar-col">
          <div className="trend-bar-track">
            <div className="trend-bar-fill" style={{
              height: `${d.total > 0 ? Math.max((d.total / max) * 100, 4) : 0}%`,
              background: d.mes === currentMonth ? 'var(--accent)' : 'rgba(199,205,212,0.28)',
            }} />
          </div>
          <span className="trend-bar-label">{d.label}</span>
        </div>
      ))}
    </div>
  );
}

function traducirErrorFirebase(code) {
  const mapa = {
    'auth/email-already-in-use': 'Ese correo ya tiene una cuenta. Intenta iniciar sesión.',
    'auth/invalid-email': 'El correo no es válido.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/user-not-found': 'No existe una cuenta con ese correo.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/too-many-requests': 'Demasiados intentos. Espera un momento e intenta de nuevo.',
    'auth/popup-closed-by-user': 'Cerraste la ventana antes de terminar. Intenta de nuevo.',
    'auth/popup-blocked': 'El navegador bloqueó la ventana. Permite ventanas emergentes e intenta de nuevo.',
    'auth/cancelled-popup-request': 'Solo se puede iniciar sesión una vez a la vez.',
    'auth/password-does-not-meet-requirements': 'La contraseña debe tener al menos 10 caracteres, con mayúscula, minúscula y número.',
    'auth/missing-password': 'Escribe tu contraseña.',
    'auth/network-request-failed': 'Sin conexión. Revisa tu internet e intenta de nuevo.',
    'auth/unauthorized-domain': 'Este sitio todavía no está autorizado en Firebase. Agrégalo en Authentication > Settings > Authorized domains.',
  };
  return mapa[code] || 'Ocurrió un error. Intenta de nuevo.';
}
function AuthScreen({ onVolver }) {

  const [info, setInfo] = useState(() => (leerLS(CIERRE_KEY) ? 'Cerramos tu sesión después de 15 minutos sin actividad, para proteger tus datos.' : ''));
  useEffect(() => { escribirLS(CIERRE_KEY, null); }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setInfo('');
    if (modo === 'signup') {
      const faltan = problemasContrasena(password);
      if (faltan.length) { setError(`A tu contraseña le falta: ${faltan.join(', ')}.`); return; }
    }
    setCargando(true);
    try {
      if (modo === 'login') {
        await auth.signInWithEmailAndPassword(email, password);
      } else {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        try { await cred.user.sendEmailVerification(); } catch (e2) { /* se puede reenviar después */ }
      }
    } catch (err) {
      setError(traducirErrorFirebase(err.code));
    } finally {
      setCargando(false);
    }
  }

  async function handleRecuperar() {
    setError(''); setInfo('');
    if (!email.trim()) { setError('Escribe tu correo arriba y vuelve a tocar "¿Olvidaste tu contraseña?".'); return; }
    try {
      await auth.sendPasswordResetEmail(email.trim());
    } catch (err) {
      if (err.code === 'auth/invalid-email') { setError(traducirErrorFirebase(err.code)); return; }
    }
    // Mismo mensaje exista o no la cuenta, para no revelar qué correos están registrados.
    setInfo('Si ese correo tiene una cuenta, te enviamos un enlace para crear una contraseña nueva. Revisa también spam.');
  }

  async function handleGoogleSignIn() {
    setError('');
    setCargando(true);
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      await auth.signInWithPopup(provider);
    } catch (err) {
      setError(traducirErrorFirebase(err.code));
    } finally {
      setCargando(false);
    }

        </button>
        <div className="auth-divider"><span>o</span></div>
        <form className="form-grid" onSubmit={handleSubmit}>
          <input className="field" type="email" placeholder="Correo electrónico" value={email}
                 onChange={(e) => setEmail(e.target.value)} required autoComplete="email" />
          <input className="field" type="password" placeholder={modo === 'login' ? 'Contraseña' : 'Contraseña (10+ caracteres, mayúscula, minúscula y número)'} value={password}
                 onChange={(e) => setPassword(e.target.value)} required minLength={modo === 'login' ? 1 : 10}
                 autoComplete={modo === 'login' ? 'current-password' : 'new-password'} />
          {modo === 'signup' && password && problemasContrasena(password).length > 0 && (
            <p className="hint" style={{ color: 'var(--text-secondary)' }}>Falta: {problemasContrasena(password).join(', ')}</p>
          )}
          {error && <p className="hint" style={{ color: 'var(--negative)' }}>{error}</p>}
          {info && <p className="hint" style={{ color: 'var(--positive)' }}>{info}</p>}
          <button className="btn-add" type="submit" disabled={cargando}>
            {cargando ? 'Un momento…' : modo === 'login' ? 'Iniciar sesión' : 'Crear cuenta'}
          </button>
        </form>
        {modo === 'login' && (
          <button className="link-btn" style={{ marginTop: 14, textAlign: 'center', width: '100%' }} onClick={handleRecuperar} disabled={cargando}>
            ¿Olvidaste tu contraseña?
          </button>
        )}
        <button className="link-btn" style={{ marginTop: 12, textAlign: 'center', width: '100%' }}
                onClick={() => { setModo(modo === 'login' ? 'signup' : 'login'); setError(''); setInfo(''); }}>
          {modo === 'login' ? '¿No tienes cuenta? Créala aquí' : '¿Ya tienes cuenta? Inicia sesión'}
        </button>
        <p className="privacidad-nota">
          Tus datos se guardan en Firebase (Google), cifrados al viajar y al almacenarse. Solo tu cuenta puede verlos desde la app.
          El administrador técnico de CoinPocket tiene acceso a la base de datos para mantenimiento y seguridad.
          No guardamos números de tarjeta, CVV ni PIN.
        </p>
        {onVolver && (
          <button className="link-btn" style={{ marginTop: 10, textAlign: 'center', width: '100%' }} onClick={onVolver}>
            Seguir sin cuenta
          </button>
        )}
      </div>
    </div>
  );
}

function VerificarCorreo({ user }) {
  const [msg, setMsg] = useState('');
  const [cargando, setCargando] = useState(false);
  async function reenviar() {
    setCargando(true); setMsg('');
    try { await user.sendEmailVerification(); setMsg(`Te enviamos otro correo a ${user.email}. Revisa también spam.`); }
    catch (e) { setMsg(e.code === 'auth/too-many-requests' ? 'Ya enviamos varios correos. Espera unos minutos.' : 'No se pudo enviar. Intenta de nuevo.'); }
    finally { setCargando(false); }
  }
  async function yaVerifique() {
    setCargando(true); setMsg('');
    try {
      await user.reload();
      if (auth.currentUser && auth.currentUser.emailVerified) { await auth.currentUser.getIdToken(true); window.location.reload(); }
      else setMsg('Todavía no aparece verificado. Abre el enlace del correo y vuelve a intentar.');
    } catch (e) { setMsg('No se pudo revisar. Intenta de nuevo.'); }
    finally { setCargando(false); }
  }
  return (
    <div className="app-shell">
      <style>{STYLES}</style>
      <div className="auth-container">
        <span className="header-icon logo-icon" style={{ margin: '0 auto 16px' }}><Logo size={30} /></span>
        <h1 className="masthead" style={{ textAlign: 'center' }}>Verifica tu correo</h1>
        <p className="header-sub" style={{ textAlign: 'center', whiteSpace: 'normal', marginBottom: 20 }}>
          Para proteger tus datos, confirma que {user.email} es tuyo. Abre el enlace que te enviamos y luego toca "Ya lo verifiqué".
        </p>
        <div className="form-grid">
          <button className="btn-add" onClick={yaVerifique} disabled={cargando}><Icon name="check" size={16} /> Ya lo verifiqué</button>
          <button className="btn-sec" onClick={reenviar} disabled={cargando}>Reenviar correo</button>
          {msg && <p className="hint" style={{ textAlign: 'center' }}>{msg}</p>}
          <button className="link-btn" style={{ marginTop: 8 }} onClick={() => auth.signOut()}>Cerrar sesión</button>
        </div>
      </div>
    </div>
  );
}

  const dataRef = useRef(null);

  // Último estado que sabemos que está en Firestore, por campo (para guardar solo lo que cambió).
  const sincronizadoRef = useRef({});
  // Normaliza lo que viene guardado (migra formatos viejos).
  function normalizarDatos(parsed) {
    const ingresosMigrados = {};
    Object.entries(parsed.ingresos || {}).forEach(([k, v]) => {
      if (typeof v === 'number') ingresosMigrados[k] = { q1: v / 2, q2: v / 2, bono: 0 };
      else if (v && typeof v === 'object') ingresosMigrados[k] = { q1: v.q1 || 0, q2: v.q2 || 0, bono: v.bono || 0 };
    });
    return {
      ingresos: ingresosMigrados, gastos: parsed.gastos || [], cuotas: parsed.cuotas || [], gastosFijos: parsed.gastosFijos || [],
      metas: parsed.metas || [], tarjetas: parsed.tarjetas || [], gastosTC: parsed.gastosTC || [], pagosTarjeta: parsed.pagosTarjeta || [],
      ajustesTarjeta: parsed.ajustesTarjeta || [], tipoCambio: typeof parsed.tipoCambio === 'number' ? parsed.tipoCambio : TIPO_CAMBIO_DEFAULT,
      pagadasManual: parsed.pagadasManual || {}, config: parsed.config || {},
    };
  }
  // Con cuenta: escucha cambios en vivo (si editas en otro dispositivo, aquí se actualiza solo).
  useEffect(() => {
    if (user.local) return;
    sincronizadoRef.current = {};
    const unsub = db.collection(STORAGE_KEY).doc(user.uid).onSnapshot((docSnap) => {
      if (docSnap.metadata.hasPendingWrites) return; // es nuestro propio cambio aún sin confirmar
      if (docSnap.exists) {
        const entrante = normalizarDatos(docSnap.data());
        const remoto = {};
        Object.keys(entrante).forEach((k) => {
          const j = jsonEstable(entrante[k]);
          if (sincronizadoRef.current[k] !== j) { remoto[k] = entrante[k]; sincronizadoRef.current[k] = j; }
        });
        if (Object.keys(remoto).length) setData((prev) => ({ ...prev, ...remoto }));
      }
      setLoaded(true);
    }, (err) => { console.error('Error cargando datos', err); setLoaded(true); });
    return () => unsub();
  }, [user.uid]);

  // Sin cuenta: datos de este navegador.
  useEffect(() => {
    if (!user.local) return;
    let cancelled = false;
    (async () => {
      try {
        let parsed = null;
        try { const raw = window.localStorage.getItem(LOCAL_KEY); if (raw) parsed = JSON.parse(raw); } catch (e) { /* sin almacenamiento local */ }
        if (!cancelled && parsed) {
          const ingresosMigrados = {};
          Object.entries(parsed.ingresos || {}).forEach(([k, v]) => {
            if (typeof v === 'number') {
              ingresosMigrados[k] = { q1: v / 2, q2: v / 2, bono: 0 };
            } else if (v && typeof v === 'object') {
              ingresosMigrados[k] = { q1: v.q1 || 0, q2: v.q2 || 0, bono: v.bono || 0 };
            }
          });
          setData({
            ingresos: ingresosMigrados,
            gastos: parsed.gastos || [],
            cuotas: parsed.cuotas || [],
            gastosFijos: parsed.gastosFijos || [],
            metas: parsed.metas || [],
            tarjetas: parsed.tarjetas || [],
            gastosTC: parsed.gastosTC || [],
            pagosTarjeta: parsed.pagosTarjeta || [],
            ajustesTarjeta: parsed.ajustesTarjeta || [],
            tipoCambio: typeof parsed.tipoCambio === 'number' ? parsed.tipoCambio : TIPO_CAMBIO_DEFAULT,
            pagadasManual: parsed.pagadasManual || {},
            config: parsed.config || {},
          });
        }
      } catch (e) {
        console.error('Error cargando datos', e);
      } finally {
        if (!cancelled) setLoaded(true);
      }
    })();
    return () => { cancelled = true; };
  }, [user.uid]);

  // Guardar en Firestore cada vez que cambian los datos
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        if (user.local) {
          try { window.localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch (e) { /* sin almacenamiento local */ }
        } else {
          // Guarda SOLO los campos que cambiaron, así dos dispositivos no se pisan cambios distintos.
          const cambios = {};
          Object.keys(data).forEach((k) => {
            if (data[k] === undefined) return;
            const j = jsonEstable(data[k]);
            if (sincronizadoRef.current[k] !== j) { cambios[k] = data[k]; sincronizadoRef.current[k] = j; }
          });
          if (Object.keys(cambios).length) await db.collection(STORAGE_KEY).doc(user.uid).set(cambios, { merge: true });
        }
      } catch (e) {
        console.error('No se pudieron guardar los datos', e);
      }
    })();
  }, [data, loaded, user.uid]);

  useEffect(() => { dataRef.current = data; }, [data]);
  // Respaldo automático: al abrir la app, si el último tiene más de 7 días, guarda una copia (se conservan 4).
  function coleccionRespaldos() { return db.collection(STORAGE_KEY).doc(user.uid).collection('respaldos'); }
  async function cargarRespaldos() {
    const snap = await coleccionRespaldos().orderBy('creado', 'desc').get();
    const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    setRespaldos(lista);
    return lista;
  }
  async function crearRespaldo(lista) {
    const d = dataRef.current;
    if (!d) return;
    await coleccionRespaldos().doc(hoyISO()).set({ creado: Date.now(), fecha: hoyISO(), datos: JSON.stringify(d) });
    const nueva = await cargarRespaldos();
    const sobran = nueva.slice(RESPALDOS_A_GUARDAR);
    for (const r of sobran) await coleccionRespaldos().doc(r.id).delete();
    if (sobran.length) await cargarRespaldos();
  }
  useEffect(() => {
    if (!loaded || user.local) return;
    const t = setTimeout(async () => {
      try {
        const lista = await cargarRespaldos();
        const d = dataRef.current || {};
        const tieneDatos = ['gastos', 'tarjetas', 'gastosTC', 'gastosFijos', 'cuotas', 'metas', 'pagosTarjeta'].some((k) => (d[k] || []).length > 0);
        if (tieneDatos && (!lista.length || Date.now() - (lista[0].creado || 0) > RESPALDO_DIAS * 86400000)) await crearRespaldo(lista);
        setRespaldoMsg('');
      } catch (e) {
        console.error('Respaldo', e);
        setRespaldoMsg(e && e.code === 'permission-denied' ? 'Para activar los respaldos, actualiza las reglas de Firestore (te las dio el asistente de configuración).' : 'No se pudieron revisar los respaldos. Intenta más tarde.');
      }
    }, 4000);
    return () => clearTimeout(t);
  }, [loaded, user.uid]);
  async function respaldoManual() {
    setRespaldoMsg('Guardando…');
    try { await crearRespaldo(); setRespaldoMsg('Respaldo guardado ✓'); }
    catch (e) { setRespaldoMsg(e && e.code === 'permission-denied' ? 'Actualiza las reglas de Firestore para activar los respaldos.' : 'No se pudo guardar el respaldo.'); }
  }
  function restaurarRespaldo(r) {
    try {
      setData(normalizarDatos(JSON.parse(r.datos)));
      setConfirmingId(null);
      setRespaldoMsg(`Restauraste el respaldo del ${formatFechaCorta(parseISODate(r.fecha))} ✓`);
    } catch (e) { setRespaldoMsg('Ese respaldo está dañado y no se pudo restaurar.'); }
  }

  useEffect(() => { setMesInicioCuota(currentMonth); setMesInicioFijo(currentMonth); }, [currentMonth]);
  useEffect(() => {
    function medir() {
      if (navRef.current) setNavHeight(navRef.current.offsetHeight);
    }
    medir();
    const t = setTimeout(medir, 300);
    window.addEventListener('resize', medir);
    return () => { window.removeEventListener('resize', medir); clearTimeout(t); };
  }, []);
  useEffect(() => {
    if (!personalizarCuotas) return;
    const n = parseInt(numCuotas, 10);
    if (!n || n < 1) return;
    setMontosCuotaPersonalizados((prev) => {
      if (prev.length === n) return prev;
      const total = parseFloat(montoTotalCuota) || 0;
      const base = n > 0 ? (total / n).toFixed(2) : '0.00';
      return Array.from({ length: n }, (_, i) => (prev[i] !== undefined ? prev[i] : base));
    });
  }, [personalizarCuotas, numCuotas]);
  useEffect(() => { setConfirmingId(null); setAbonoFormId(null); setAporteFormId(null); setPagoTarjetaFormId(null); setAjusteSaldoFormId(null); setEditandoNombreGastoId(null); }, [currentMonth]);
  useEffect(() => { setConfirmingId(null); setAbonoFormId(null); setAporteFormId(null); setPagoTarjetaFormId(null); setEditandoTarjetaId(null); setAjusteSaldoFormId(null); setEditandoNombreGastoId(null); }, [view]);

  const gastosUnicosMes = useMemo(() => data.gastos.filter((g) => g.mes === currentMonth).sort((a, b) => (a.dia || 999) - (b.dia || 999)), [data.gastos, currentMonth]);
  const cuotasActivasMes = useMemo(() => getCuotasActivas(data.cuotas, currentMonth), [data.cuotas, currentMonth]);
  const gastosFijosActivosMes = useMemo(() => data.gastosFijos.filter((f) => gastoFijoActivoEnMes(f, currentMonth)).sort((a, b) => (a.dia || 999) - (b.dia || 999)), [data.gastosFijos, currentMonth]);
  const gastosTCActivosMes = useMemo(() => getGastosTCActivos(data.gastosTC, data.tarjetas, currentMonth), [data.gastosTC, data.tarjetas, currentMonth]);
  const resumenTarjetasMes = useMemo(() => {
    return data.tarjetas
      .map((t) => {
        const e = getEstadoTarjeta(t, data, currentMonth);
        return { ...t, montoDelMes: e.pendiente, fechaPago: e.fechaPago };
      })
      .filter((t) => t.montoDelMes > 0.005)
      .sort((a, b) => (a.diaPago || 999) - (b.diaPago || 999));
  }, [data, currentMonth]);
  const ingresoMes = useMemo(() => getIngresoMes(data.ingresos, currentMonth), [data.ingresos, currentMonth]);
  const ingresoEfectivo = ingresoMes.q1 + ingresoMes.q2 + ingresoMes.bono;
  const pagosTarjetaMes = useMemo(
    () => (data.pagosTarjeta || []).filter((p) => (p.fecha ? p.fecha.slice(0, 7) : p.mes) === currentMonth),
    [data.pagosTarjeta, currentMonth]
  );
  const pagosTarjetaMesPorTarjeta = useMemo(() => {
    const map = {};
    pagosTarjetaMes.forEach((p) => {
      if (!map[p.tarjetaId]) map[p.tarjetaId] = { tarjetaId: p.tarjetaId, total: 0 };
      map[p.tarjetaId].total += p.monto;
    });
    return Object.values(map).map((r) => ({
      ...r,
      nombre: (data.tarjetas.find((t) => t.id === r.tarjetaId) || {}).nombre || 'Tarjeta',
    }));
  }, [pagosTarjetaMes, data.tarjetas]);
  const totalGastosMes = useMemo(() => {
    // Flujo de caja real: efectivo/débito sale de inmediato; lo pagado con tarjeta
    // no resta hasta que registrás el pago a esa tarjeta.
    const sumUnicos = gastosUnicosMes.filter((g) => g.metodoPago !== 'tarjeta').reduce((a, g) => a + g.monto, 0);
    const sumFijos = gastosFijosActivosMes.filter((f) => f.metodoPago !== 'tarjeta').reduce((a, f) => a + f.monto, 0);
    const sumPagosTarjeta = pagosTarjetaMes.reduce((a, p) => a + p.monto, 0);
    return sumUnicos + sumFijos + sumPagosTarjeta;
  }, [gastosUnicosMes, gastosFijosActivosMes, pagosTarjetaMes]);
  const aportesMes = useMemo(() => data.metas.reduce((sum, m) => sum + ((m.aportes && m.aportes[currentMonth]) || 0), 0), [data.metas, currentMonth]);
  const saldo = ingresoEfectivo - totalGastosMes - aportesMes;

  const compromisosFuturos = useMemo(() => {
    return data.cuotas.map((c) => ({ ...c, ...getCompromiso(c, currentMonth) })).filter((c) => c.restantes > 0).sort((a, b) => b.restantes - a.restantes);
  }, [data.cuotas, currentMonth]);

  const historialAbonos = useMemo(() => getHistorialAbonos(data.cuotas), [data.cuotas]);
  const historialAportes = useMemo(() => getHistorialAportes(data.metas), [data.metas]);
  const totalAhorradoGeneral = useMemo(() => data.metas.reduce((sum, m) => sum + getTotalAportado(m), 0), [data.metas]);

  const porCategoria = useMemo(() => {
    const map = {};
    gastosUnicosMes.forEach((g) => { map[g.categoria] = (map[g.categoria] || 0) + g.monto; });
    cuotasActivasMes.forEach((c) => { map[c.categoria] = (map[c.categoria] || 0) + c.montoCuota; });
    gastosFijosActivosMes.forEach((f) => { map[f.categoria] = (map[f.categoria] || 0) + f.monto; });

    setConfirmReset(false);
  }
  function quitarAjustesTarjeta(tarjetaId, mes) {
    setData((prev) => ({ ...prev, ajustesTarjeta: (prev.ajustesTarjeta || []).filter((a) => !(a.tarjetaId === tarjetaId && a.mes === mes)) }));
  }
  function quitarAjuste(id) {
    setData((prev) => ({ ...prev, ajustesTarjeta: (prev.ajustesTarjeta || []).filter((a) => a.id !== id) }));
  }
  function ajustarSaldoTarjeta(tarjetaId, montoReal, fecha) {
    // Corte de cuentas: a esta fecha debes exactamente este monto. Lo anterior queda pagado.
    const val = parseFloat(montoReal);
    if (isNaN(val) || val < 0) return;
    setData((prev) => ({
      ...prev,
      tarjetas: prev.tarjetas.map((t) => t.id === tarjetaId ? { ...t, conciliacion: { fecha: fecha || hoyISO(), saldo: val, creado: Date.now() } } : t),
      // los ajustes viejos de esta tarjeta quedan reemplazados por este saldo
      ajustesTarjeta: (prev.ajustesTarjeta || []).filter((a) => a.tarjetaId !== tarjetaId),
    }));
  }
  function quitarConciliacion(tarjetaId) {
    setData((prev) => ({ ...prev, tarjetas: prev.tarjetas.map((t) => { if (t.id !== tarjetaId) return t; const { conciliacion, ...resto } = t; return resto; }) }));
  }

  if (!loaded) {
    return (
      <div className="app-shell">
        <style>{STYLES}</style>
        <div className="loading-screen">Abriendo tu dashboard…</div>
      </div>
    );

            </div>
          </div>

              </button>

              <button className="icon-btn small" onClick={() => setEditingFx(false)} aria-label="Cancelar"><Icon name="x" size={16} /></button>

                <button className="icon-btn small" onClick={() => setEditingQuincena(null)} aria-label="Cancelar"><Icon name="x" size={16} /></button>
              </div>
            ) : (
              <button className="value-edit-btn" onClick={() => { setIngresoDraft(ingresoMes.q1 ? String(ingresoMes.q1) : ''); setEditingQuincena('q1'); }}>
                <span className="amount-mono">{formatQ(ingresoMes.q1)}</span>
                <Icon name="pencil" size={13} />
              </button>
            )}
          </div>

          <div className="balance-line">
            <span className="label">2da quincena <span className="date-range">(16–fin)</span></span>
            {editingQuincena === 'q2' ? (
              <div className="ingreso-edit">
                <input type="number" step="0.01" min="0" autoFocus className="ingreso-input" value={ingresoDraft}
                       onChange={(e) => setIngresoDraft(e.target.value)}
                       onKeyDown={(e) => { if (e.key === 'Enter') saveQuincena('q2'); if (e.key === 'Escape') setEditingQuincena(null); }} />
                <button className="icon-btn small" onClick={() => saveQuincena('q2')} aria-label="Guardar 2da quincena"><Icon name="check" size={16} /></button>
                <button className="icon-btn small" onClick={() => setEditingQuincena(null)} aria-label="Cancelar"><Icon name="x" size={16} /></button>
              </div>
            ) : (
              <button className="value-edit-btn" onClick={() => { setIngresoDraft(ingresoMes.q2 ? String(ingresoMes.q2) : ''); setEditingQuincena('q2'); }}>
                <span className="amount-mono">{formatQ(ingresoMes.q2)}</span>
                <Icon name="pencil" size={13} />
              </button>

          </div>

          <div className="balance-line">

            {editingQuincena === 'bono' ? (

                  <button type="button" className={`currency-btn ${monedaFijo === 'GTQ' ? 'active' : ''}`} onClick={() => setMonedaFijo('GTQ')}>Q</button>
                  <button type="button" className={`currency-btn ${monedaFijo === 'USD' ? 'active' : ''}`} onClick={() => setMonedaFijo('USD')}>$</button>

              <label className="field-label">

                <input className="field" type="number" min="1" max="31" placeholder="Día (1-31)" value={diaFijo} onChange={(e) => setDiaFijo(e.target.value)} />
              </label>
              <label className="field-label">
                Método de pago
                <div className="method-toggle">
                  {METODOS_PAGO.map((m) => (
                    <button key={m.id} type="button" className={`method-btn ${metodoFijo === m.id ? 'active' : ''}`} onClick={() => setMetodoFijo(m.id)}>
                      <Icon name={m.icon} size={14} /><span>{m.label}</span>

              {metodoFijo === 'tarjeta' && (

                    {data.tarjetas.map((t) => <option key={t.id} value={t.id}>{t.nombre}</option>)}
                  </select>

              {monedaFijo === 'USD' && montoFijo && parseFloat(montoFijo) > 0 && (

              <p className="hint">Se repetirá automáticamente cada mes desde {monthLabel(mesInicioFijo)} hasta que lo elimines.</p>
              <button className="btn-add" onClick={addGastoFijo} disabled={!descFijo.trim() || !montoFijo || parseFloat(montoFijo) <= 0}>

          {tab === 'cuota' && (

              <select className="field" value={catCuota} onChange={(e) => setCatCuota(e.target.value)}>

              <div className="monto-row">
                <input className="field" type="number" step="0.01" min="0" placeholder={monedaCuota === 'USD' ? 'Monto total de la compra ($)' : 'Monto total de la compra (Q)'}

                <div className="currency-toggle">
                  <button type="button" className={`currency-btn ${monedaCuota === 'GTQ' ? 'active' : ''}`} onClick={() => setMonedaCuota('GTQ')}>Q</button>
                  <button type="button" className={`currency-btn ${monedaCuota === 'USD' ? 'active' : ''}`} onClick={() => setMonedaCuota('USD')}>$</button>

              {monedaCuota === 'USD' && montoTotalCuota && parseFloat(montoTotalCuota) > 0 && (

              {cuotaMontoPreview !== null && !personalizarCuotas && (<p className="hint">Cada cuota será de {formatQ(cuotaMontoPreview)}</p>)}
              {numCuotas && parseInt(numCuotas, 10) > 0 && montoTotalCuota && parseFloat(montoTotalCuota) > 0 && (

                    if (!personalizarCuotas) {
                      const total = parseFloat(montoTotalCuota) || 0;
                      const base = n > 0 ? (total / n).toFixed(2) : '0.00';
                      setMontosCuotaPersonalizados(Array.from({ length: n }, () => base));

                    setPersonalizarCuotas(!personalizarCuotas);

                      <input
                        type="number" step="0.01" min="0" className="field"
