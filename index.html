function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
function addMonths(key, n) {
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return monthKey(d);
}
function monthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  return `${MESES[m - 1]} ${y}`;
}
function formatQ(n) {
  const num = Number(n) || 0;
  const sign = num < 0 ? '-' : '';
  return sign + 'Q ' + Math.abs(num).toLocaleString('es-GT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function catInfo(id) { return CATEGORIAS.find((c) => c.id === id) || CATEGORIAS[CATEGORIAS.length - 1]; }
function catColor(id) { return catInfo(id).color; }
function catLabel(id) { return catInfo(id).label; }

function getIngresoMes(ingresos, monthK) {
  const keys = Object.keys(ingresos).filter((k) => k <= monthK).sort();
  let q1 = 0, q2 = 0;
  if (ingresos[monthK]) {
    q1 = ingresos[monthK].q1 || 0;
    q2 = ingresos[monthK].q2 || 0;
  } else if (keys.length > 0) {
    const last = ingresos[keys[keys.length - 1]];
    q1 = last.q1 || 0;
    q2 = last.q2 || 0;
  }
  const bono = (ingresos[monthK] && ingresos[monthK].bono) || 0;
  return { q1, q2, bono };
}
function simularCuota(c) {
  const montosBase = (c.montosPersonalizados && c.montosPersonalizados.length === c.numCuotas) ? c.montosPersonalizados : null;
  const montoBaseDefault = c.montoTotal / c.numCuotas;
  const abonos = c.abonos || {};
  let saldo = c.montoTotal;
  let mes = c.mesInicio;
  const pagos = [];
  let guard = 0, index = 0;
  while (saldo > 0.005 && guard < 600) {
    const montoBaseEsteMes = montosBase
      ? (montosBase[index] !== undefined ? montosBase[index] : montosBase[montosBase.length - 1])
      : montoBaseDefault;
    const extra = abonos[mes] || 0;
    const monto = Math.min(montoBaseEsteMes + extra, saldo);
    saldo = Math.max(saldo - monto, 0);
    pagos.push({ mes, numero: pagos.length + 1, monto, tieneAbono: extra > 0, saldoRestante: saldo });
    mes = addMonths(mes, 1);
    guard += 1;
    index += 1;
  }
  return pagos;
}
function getCuotasActivas(cuotas, monthK) {
  return cuotas.map((c) => {
    const pagos = simularCuota(c);
    const pago = pagos.find((p) => p.mes === monthK);
    if (!pago) return null;
    const progresoPct = ((c.montoTotal - pago.saldoRestante) / c.montoTotal) * 100;
    return { ...c, cuotaActual: pago.numero, montoCuota: pago.monto, tieneAbono: pago.tieneAbono, progresoPct };
  }).filter(Boolean).sort((a, b) => (a.dia || 999) - (b.dia || 999));
}
function getCompromiso(c, monthK) {
  const pagos = simularCuota(c);
  const pago = pagos.find((p) => p.mes === monthK);
  if (pago) return { restantes: pagos.length - pago.numero, montoRestante: pago.saldoRestante };
  if (pagos.length > 0 && monthK < pagos[0].mes) return { restantes: pagos.length, montoRestante: c.montoTotal };
  return { restantes: 0, montoRestante: 0 };
}
function getHistorialAbonos(cuotas) {
  const list = [];
  cuotas.forEach((c) => {
    Object.entries(c.abonos || {}).forEach(([mes, monto]) => {
      list.push({ cuotaId: c.id, cuotaDescripcion: c.descripcion, categoria: c.categoria, mes, monto });
    });
  });
  return list.sort((a, b) => (a.mes < b.mes ? 1 : a.mes > b.mes ? -1 : 0));
}
function diasEnMes(year, month1) { return new Date(year, month1, 0).getDate(); }
function calcularCicloTC(fechaCompraISO, diaCorte, diaPago) {
  const [y, m, d] = fechaCompraISO.split('-').map(Number);
  const compra = new Date(y, m - 1, d);
  const corteEsteMesDia = Math.min(diaCorte, diasEnMes(y, m));
  const corteEsteMes = new Date(y, m - 1, corteEsteMesDia);
  let corteYear, corteMonth;
  if (compra <= corteEsteMes) { corteYear = y; corteMonth = m; }
  else { corteMonth = m + 1; corteYear = y; if (corteMonth > 12) { corteMonth = 1; corteYear += 1; } }
  const corteDiaFinal = Math.min(diaCorte, diasEnMes(corteYear, corteMonth));
  const fechaCorte = new Date(corteYear, corteMonth - 1, corteDiaFinal);
  let pagoMonth = corteMonth + 1, pagoYear = corteYear;
  if (pagoMonth > 12) { pagoMonth = 1; pagoYear += 1; }
  const pagoDiaFinal = Math.min(diaPago, diasEnMes(pagoYear, pagoMonth));
  const fechaPago = new Date(pagoYear, pagoMonth - 1, pagoDiaFinal);
  return { fechaCorte, fechaPago, mesPago: `${pagoYear}-${String(pagoMonth).padStart(2, '0')}` };
}
function formatFechaCorta(date) { return date.toLocaleDateString('es-GT', { day: '2-digit', month: 'short', year: 'numeric' }); }
function parseISODate(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function hoyDia() {
  return new Date().getDate();
}
function clampDia(v) {
  const n = parseInt(v, 10);
  if (!n || n < 1) return null;
  return Math.min(n, 31);
}
function getGastosTCActivos(gastosTC, tarjetas, monthK) {
  return gastosTC.map((g) => {
    const tarjeta = tarjetas.find((t) => t.id === g.tarjetaId);
    if (!tarjeta) return null;
    const ciclo = calcularCicloTC(g.fechaCompra, tarjeta.diaCorte, tarjeta.diaPago);
    return { ...g, tarjetaNombre: tarjeta.nombre, ...ciclo };
  }).filter((g) => g && g.mesPago === monthK);
}
function simularTarjeta(tarjeta, gastosTC, pagosTarjeta, hastaMes) {
  const gastosDeTarjeta = gastosTC.filter((g) => g.tarjetaId === tarjeta.id);
  const esperadoPorMes = {};
  gastosDeTarjeta.forEach((g) => {
    const ciclo = calcularCicloTC(g.fechaCompra, tarjeta.diaCorte, tarjeta.diaPago);
    esperadoPorMes[ciclo.mesPago] = (esperadoPorMes[ciclo.mesPago] || 0) + g.monto;
  });
  const pagadoPorMes = {};
  pagosTarjeta.filter((p) => p.tarjetaId === tarjeta.id).forEach((p) => {
    const mes = p.fecha ? p.fecha.slice(0, 7) : p.mes;
    pagadoPorMes[mes] = (pagadoPorMes[mes] || 0) + p.monto;
  });
  const todosMeses = [...new Set([...Object.keys(esperadoPorMes), ...Object.keys(pagadoPorMes)])].sort();
  if (todosMeses.length === 0 || hastaMes < todosMeses[0]) return { montoDelMes: 0, esperadoDelMes: 0, ajusteAcumulado: 0 };
  let ajuste = 0, mes = todosMeses[0], montoDelMesObjetivo = 0, esperadoDelMesObjetivo = 0, guard = 0;
  while (mes <= hastaMes && guard < 1200) {
    const esperadoOriginal = esperadoPorMes[mes] || 0;
    const esperadoEfectivo = Math.max(esperadoOriginal - ajuste, 0);
    const pagoRegistrado = pagadoPorMes[mes];
    const montoDelMes = pagoRegistrado !== undefined ? pagoRegistrado : esperadoEfectivo;
    if (mes === hastaMes) { montoDelMesObjetivo = montoDelMes; esperadoDelMesObjetivo = esperadoEfectivo; }
    ajuste = ajuste + (montoDelMes - esperadoOriginal);
    mes = addMonths(mes, 1);
    guard++;
  }
  return { montoDelMes: montoDelMesObjetivo, esperadoDelMes: esperadoDelMesObjetivo, ajusteAcumulado: ajuste };
}
function getTotalGastosMes(data, monthK) {
  const unicos = data.gastos.filter((g) => g.mes === monthK).reduce((a, g) => a + g.monto, 0);
  const cuotas = getCuotasActivas(data.cuotas, monthK).reduce((a, c) => a + c.montoCuota, 0);
  const fijos = data.gastosFijos.filter((f) => monthK >= f.mesInicio).reduce((a, f) => a + f.monto, 0);
  const tc = data.tarjetas.reduce((a, t) => a + simularTarjeta(t, data.gastosTC, data.pagosTarjeta || [], monthK).montoDelMes, 0);
  return unicos + cuotas + fijos + tc;
}
function monthsBetween(fromKey, toKey) {
  const [y1, m1] = fromKey.split('-').map(Number);
  const [y2, m2] = toKey.split('-').map(Number);
  return (y2 - y1) * 12 + (m2 - m1);
}
function getTotalAportado(meta) { return Object.values(meta.aportes || {}).reduce((a, b) => a + b, 0); }
function getMetaProgreso(meta) {
  const totalAportado = getTotalAportado(meta);
  const restante = Math.max(meta.montoMeta - totalAportado, 0);
  const pct = meta.montoMeta > 0 ? Math.min((totalAportado / meta.montoMeta) * 100, 100) : 0;
  return { totalAportado, restante, pct, completada: totalAportado >= meta.montoMeta };
}
function getHistorialAportes(metas) {
  const list = [];
  metas.forEach((m) => {
    Object.entries(m.aportes || {}).forEach(([mes, monto]) => {
      list.push({ metaId: m.id, metaDescripcion: m.descripcion, mes, monto });
    });
  });
  return list.sort((a, b) => (a.mes < b.mes ? 1 : a.mes > b.mes ? -1 : 0));
}
function getHistorialPagosTarjeta(tarjetas, pagosTarjeta) {
  return pagosTarjeta
    .map((p) => {
      const t = tarjetas.find((x) => x.id === p.tarjetaId);
      const fecha = p.fecha || (p.mes ? `${p.mes}-01` : hoyISO());
      return { ...p, fecha, tarjetaNombre: t ? t.nombre : '—' };
    })
    .sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0));
}

function DonutChart({ data, size = 200, strokeWidth = 22 }) {
  const total = data.reduce((sum, d) => sum + d.total, 0);
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  let cumulative = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <g transform={`rotate(-90 ${size / 2} ${size / 2})`}>
        {total === 0 ? (
          <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth={strokeWidth} />
        ) : data.map((d) => {
          const frac = d.total / total;
          const dash = frac * circumference;
          const offset = -(cumulative * circumference);
          cumulative += frac;
          return (
            <circle key={d.id} cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={d.color}
                    strokeWidth={strokeWidth} strokeDasharray={`${dash} ${circumference - dash}`} strokeDashoffset={offset} />
          );
        })}
      </g>
    </svg>
  );
}
function TrendBarChart({ data, currentMonth, height = 160 }) {
  const max = Math.max(...data.map((d) => d.total), 1);
  return (
    <div className="trend-bars" style={{ height }}>
      {data.map((d) => (
        <div key={d.mes} className="trend-bar-col">
          <div className="trend-bar-track">
            <div className="trend-bar-fill" style={{
              height: `${d.total > 0 ? Math.max((d.total / max) * 100, 4) : 0}%`,
              background: d.mes === currentMonth ? 'var(--accent)' : 'rgba(199,205,212,0.28)',
            }} />
          </div>
          <span className="trend-bar-label">{d.label}</span>
        </div>
      ))}
    </div>
  );
}

function traducirErrorFirebase(code) {
  const mapa = {
    'auth/email-already-in-use': 'Ese correo ya tiene una cuenta. Intenta iniciar sesión.',
    'auth/invalid-email': 'El correo no es válido.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/user-not-found': 'No existe una cuenta con ese correo.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/too-many-requests': 'Demasiados intentos. Espera un momento e intenta de nuevo.',
    'auth/popup-closed-by-user': 'Cerraste la ventana antes de terminar. Intenta de nuevo.',
    'auth/popup-blocked': 'El navegador bloqueó la ventana. Permite ventanas emergentes e intenta de nuevo.',
    'auth/cancelled-popup-request': 'Solo se puede iniciar sesión una vez a la vez.',
    'auth/unauthorized-domain': 'Este sitio todavía no está autorizado en Firebase. Agrégalo en Authentication > Settings > Authorized domains.',
  };
  return mapa[code] || 'Ocurrió un error. Intenta de nuevo.';
}
function AuthScreen() {

  const [password, setPassword] = useState('');
  const [error, setError] = useState('');

    e.preventDefault();
    setError('');
    setCargando(true);
    try {
      if (modo === 'login') {
        await auth.signInWithEmailAndPassword(email, password);
      } else {
        await auth.createUserWithEmailAndPassword(email, password);
      }
    } catch (err) {
      setError(traducirErrorFirebase(err.code));
    } finally {
      setCargando(false);
    }
  }

  async function handleGoogleSignIn() {
    setError('');
    setCargando(true);
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      await auth.signInWithPopup(provider);
    } catch (err) {
      setError(traducirErrorFirebase(err.code));
    } finally {
      setCargando(false);
    }
  }

  return (
    <div className="app-shell">

        <button className="btn-google" onClick={handleGoogleSignIn} disabled={cargando} type="button">
          <Icon name="google" size={18} /> Continuar con Google
        </button>
        <div className="auth-divider"><span>o</span></div>
        <form className="form-grid" onSubmit={handleSubmit}>
          <input className="field" type="email" placeholder="Correo electrónico" value={email}
                 onChange={(e) => setEmail(e.target.value)} required autoComplete="email" />
          <input className="field" type="password" placeholder="Contraseña (mínimo 6 caracteres)" value={password}
                 onChange={(e) => setPassword(e.target.value)} required minLength={6}
                 autoComplete={modo === 'login' ? 'current-password' : 'new-password'} />
          {error && <p className="hint" style={{ color: 'var(--negative)' }}>{error}</p>}
          <button className="btn-add" type="submit" disabled={cargando}>

        </form>

      cuotas: prev.cuotas.map((c) => c.id === cuotaId ? { ...c, abonos: { ...(c.abonos || {}), [currentMonth]: ((c.abonos && c.abonos[currentMonth]) || 0) + val } } : c),

                          <div className="cuota-body">
                            <div className="row-desc">{t.nombre}</div>
                            <p className="meta-detail">
                              Pago de este mes: {formatQ(resumen.montoDelMes)}
                              {resumen.ajusteAcumulado > 0 && ` · ${formatQ(resumen.ajusteAcumulado)} a favor`}
                              {resumen.ajusteAcumulado < 0 && ` · debes ${formatQ(-resumen.ajusteAcumulado)} adicional`}
                            </p>
                            {pagoTarjetaFormId === t.id ? (
                              <div className="abono-form">
                                <input
                                  type="number" step="0.01" min="0" autoFocus
                                  className="abono-input" placeholder="Monto que pagaste (Q)"
                                  value={pagoTarjetaDraft}
                                  onChange={(e) => setPagoTarjetaDraft(e.target.value)}
                                  onKeyDown={(e) => { if (e.key === 'Enter') addPagoTarjeta(t.id); if (e.key === 'Escape') setPagoTarjetaFormId(null); }}
                                />
                                <input
                                  type="date" className="abono-input"
                                  value={pagoTarjetaFecha}
                                  onChange={(e) => setPagoTarjetaFecha(e.target.value)}
                                />
                                <button className="icon-btn small" onClick={() => addPagoTarjeta(t.id)} aria-label="Guardar pago"><Icon name="check" size={16} /></button>
                                <button className="icon-btn small" onClick={() => setPagoTarjetaFormId(null)} aria-label="Cancelar"><Icon name="x" size={16} /></button>
                              </div>
                            ) : (
                              <button
                                className="abono-link"
                                onClick={() => { setPagoTarjetaDraft(''); setPagoTarjetaFecha(hoyISO()); setPagoTarjetaFormId(t.id); }}
                              >
                                + Registrar pago
                              </button>
                            )}
                            {totalCargos > 0 && (
                              <button className="tarjeta-toggle-btn" onClick={() => toggleTarjetaAbierta(t.id)}>
                                <Icon name="chevronDown" size={14} style={abierta ? { transform: 'rotate(180deg)' } : {}} />
                                {abierta ? 'Ocultar' : 'Mostrar'} {totalCargos} cargo{totalCargos !== 1 ? 's' : ''}
                              </button>
                            )}
                          </div>
                        </div>
                      </li>
                    );
                  })}
                </ul>
              )}

              {data.tarjetas.map((t) => {
                const compras = gastosTCPorTarjeta[t.id] || [];
                const cuotasVinculadas = cuotasPorTarjeta[t.id] || [];
                const unicosVinculados = gastosUnicosPorTarjeta[t.id] || [];
                const fijosVinculados = gastosFijosPorTarjeta[t.id] || [];
                const abierta = !!tarjetasAbiertas[t.id];
                const totalItems = compras.length + cuotasVinculadas.length + unicosVinculados.length + fijosVinculados.length;
                if (!abierta || totalItems === 0) return null;

                const entradas = [
                  ...cuotasVinculadas.map((c) => ({ tipo: 'cuota', dia: c.dia || 999, item: c })),
                  ...unicosVinculados.map((g) => ({ tipo: 'unico', dia: g.dia || 999, item: g })),
                  ...fijosVinculados.map((f) => ({ tipo: 'fijo', dia: f.dia || 999, item: f })),
                  ...compras.map((g) => ({ tipo: 'tc', dia: parseISODate(g.fechaCompra).getDate(), item: g })),
                ].sort((a, b) => a.dia - b.dia);

                return (
                  <ul className="ledger-list tarjeta-compras-list" key={`compras-${t.id}`}>
                    {entradas.map((e) => {
                      if (e.tipo === 'cuota') {
                        const c = e.item;
                        const compromiso = getCompromiso(c, currentMonth);
                        return (
                          <li key={`cuota-${c.id}`} className="ledger-row">
                            <div className="row-main">
                              <CategoryBadge id={c.categoria} />
                              <DayBadge dia={c.dia} />
                              <div>
                                <div className="row-desc">
                                  {c.descripcion} <span className="pill pill-cuota">Cuota · {c.numCuotas} meses</span>
                                </div>
                                <p className="meta-detail">
                                  Total: {formatQ(c.montoTotal)}
                                  {compromiso.restantes > 0 && ` · quedan ${compromiso.restantes} cuota${compromiso.restantes !== 1 ? 's' : ''}`}
                                </p>
                              </div>
                            </div>
                          </li>
                        );
                      }
                      if (e.tipo === 'unico') {
                        const g = e.item;
                        return (
                          <li key={`unico-${g.id}`} className="ledger-row">
                            <div className="row-main">
                              <CategoryBadge id={g.categoria} />
                              <DayBadge dia={g.dia} />
                              <div className="row-desc">
                                {g.descripcion}
                                {g.moneda === 'USD' && <span className="pill pill-usd">${g.montoOriginal.toFixed(2)} USD</span>}
                              </div>
                            </div>
                            <div className="row-actions">
                              <span className="amount-mono negative">-{formatQ(g.monto)}</span>
                            </div>
                          </li>
                        );
                      }
                      if (e.tipo === 'fijo') {
                        const f = e.item;
                        return (
                          <li key={`fijo-${f.id}`} className="ledger-row">
                            <div className="row-main">
                              <CategoryBadge id={f.categoria} />
                              <DayBadge dia={f.dia} />
                              <div className="row-desc">
                                {f.descripcion} <span className="pill">Fijo</span>
                                {f.moneda === 'USD' && <span className="pill pill-usd">${f.montoOriginal.toFixed(2)} USD</span>}
                              </div>
                            </div>
                            <div className="row-actions">
                              <span className="amount-mono negative">-{formatQ(f.monto)}</span>
                            </div>
                          </li>
                        );
                      }
                      const g = e.item;
                      return (
                        <li key={g.id} className="ledger-row">
                          <div className="row-main">
                            <CategoryBadge id={g.categoria} />
                            <DayBadge dia={e.dia} />
                            <div>
                              <div className="row-desc">
                                {g.descripcion}
                                {g.moneda === 'USD' && <span className="pill pill-usd">${g.montoOriginal.toFixed(2)} USD</span>}
                              </div>
                              <p className="meta-detail">Corte: {formatFechaCorta(g.fechaCorte)} · Pago: {formatFechaCorta(g.fechaPago)}</p>
                            </div>
                          </div>
                          <div className="row-actions">
                            <span className="amount-mono negative">-{formatQ(g.monto)}</span>
                            {confirmingId === `tc__${g.id}` ? (
                              <span className="confirm-group">
                                <button className="icon-btn small" onClick={() => { removeGastoTC(g.id); setConfirmingId(null); }} aria-label="Confirmar eliminar"><Icon name="check" size={14} /></button>
                                <button className="icon-btn small" onClick={() => setConfirmingId(null)} aria-label="Cancelar"><Icon name="x" size={14} /></button>
                              </span>
                            ) : (
                              <button className="icon-btn small danger" onClick={() => setConfirmingId(`tc__${g.id}`)} aria-label="Eliminar gasto con TC"><Icon name="trash" size={14} /></button>
                            )}
                          </div>
                        </li>
                      );
                    })}
                  </ul>
                );
              })}

              {historialPagosTarjeta.length > 0 && (
                <>
                  <h2 className="section-title" style={{ marginTop: 18 }}>Historial de pagos</h2>
                  <ul className="ledger-list">
                    {historialPagosTarjeta.map((p) => (
                      <li key={p.id} className="ledger-row">
                        <div className="row-main">
                          <span className="cat-badge tarjeta-badge"><Icon name="creditCard" size={16} /></span>
                          <DayBadge dia={parseISODate(p.fecha).getDate()} />
                          <div className="row-desc">{p.tarjetaNombre} <span className="cat-name">{formatFechaCorta(parseISODate(p.fecha))}</span></div>
                        </div>
                        <div className="row-actions">
                          <span className="amount-mono positive">+{formatQ(p.monto)}</span>
                          {confirmingId === `pago__${p.id}` ? (
                            <span className="confirm-group">
                              <button className="icon-btn small" onClick={() => removePagoTarjeta(p.id)} aria-label="Confirmar eliminar pago"><Icon name="check" size={14} /></button>
                              <button className="icon-btn small" onClick={() => setConfirmingId(null)} aria-label="Cancelar"><Icon name="x" size={14} /></button>
                            </span>
                          ) : (
                            <button className="icon-btn small danger" onClick={() => setConfirmingId(`pago__${p.id}`)} aria-label="Eliminar pago"><Icon name="trash" size={14} /></button>
                          )}
                        </div>
                      </li>
                    ))}
                  </ul>
                </>
              )}
            </div>
          )}
            {todosGastosTC.length === 0 && data.tarjetas.length === 0 && (
              <div className="card">
                <h2 className="section-title">Tarjetas de crédito</h2>
                <p className="empty-state">Aún no tienes tarjetas registradas. Agrega una desde la pestaña "Gasto con TC" en Inicio.</p>
              </div>
            )}
          </>
        )}
      </div>

      <nav className="tab-bar" ref={navRef}>
        <div className="tab-bar-inner">
          <button className={`tab-bar-btn ${view === 'inicio' ? 'active' : ''}`} onClick={() => setView('inicio')}>
            <Icon name="layoutDashboard" size={20} /><span>Inicio</span>
          </button>
          <button className={`tab-bar-btn ${view === 'tendencia' ? 'active' : ''}`} onClick={() => setView('tendencia')}>
            <Icon name="trendingUp" size={20} /><span>Tendencia</span>
          </button>
          <button className={`tab-bar-btn ${view === 'ahorro' ? 'active' : ''}`} onClick={() => setView('ahorro')}>
            <Icon name="piggyBank" size={20} /><span>Ahorro</span>
          </button>
          <button className={`tab-bar-btn ${view === 'tarjetas' ? 'active' : ''}`} onClick={() => setView('tarjetas')}>
            <Icon name="creditCard" size={20} /><span>Tarjetas</span>
          </button>
        </div>
      </nav>
    </div>
  );
}

/* ============================== RAÍZ (control de sesión) ============================== */
function Root() {
  const [user, setUser] = useState(undefined); // undefined = cargando, null = sin sesión

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => setUser(u));
    return unsub;
  }, []);

  if (user === undefined) {
    return (
      <div className="app-shell">
        <style>{STYLES}</style>
        <div className="loading-screen">Cargando…</div>
      </div>
    );
  }
  if (!user) return <AuthScreen />;
  return <ControlGastos user={user} />;
}

.tarjeta-toggle-btn { display:flex; align-items:center; gap:4px; background:none; border:none; color:var(--text-secondary); font-size:11.5px; font-weight:600; padding:8px 0 0; margin:0; cursor:pointer; font-family:'Inter', sans-serif; }
.cuotas-personalizadas { display:flex; flex-direction:column; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px; max-height:260px; overflow-y:auto; }
.cuota-personalizada-row { display:flex; align-items:center; gap:8px; }
.cuota-personalizada-label { font-size:12px; color:var(--text-secondary); min-width:56px; flex-shrink:0; }
.cuota-personalizada-row .field { padding:7px 10px; font-size:13px; }
.tarjeta-toggle-btn:hover { color:var(--silver); }
.tarjeta-toggle-btn svg { transition: transform 0.15s ease; }
.tarjeta-compras-list { margin-top:-4px; }
.day-badge { min-width:26px; height:26px; padding:0 4px; border-radius:8px; background:rgba(255,255,255,0.06); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:'Inter', sans-serif; flex-shrink:0; }
.abono-link:hover { color:#64B5FF; }
.abono-form { display:flex; align-items:center; gap:6px; margin-top:8px; }
.abono-input { width:130px; background:var(--bg); border:1px solid var(--accent); color:var(--text); border-radius:8px; padding:5px 8px; font-family:'Inter', sans-serif; font-size:13px; }
.cuota-body { min-width:0; flex:1; }

.donut-wrap { position:relative; display:flex; justify-content:center; }
.donut-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; pointer-events:none; }
.donut-total { font-size:19px; font-weight:800; color:var(--text); letter-spacing:-0.01em; }
.donut-caption { font-size:11px; color:var(--text-secondary); margin-top:2px; }

.legend-list { list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; }
.legend-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
.legend-row:last-child { border-bottom:none; }
.legend-label { font-size:13.5px; color:var(--text); flex:1; }
.legend-amount { font-family:'Inter', sans-serif; font-variant-numeric: tabular-nums; font-size:13px; color:var(--text); font-weight:600; }
.legend-pct { font-size:11.5px; color:var(--text-secondary); min-width:32px; text-align:right; }

.footer-row { text-align:center; margin-top:24px; }

.tab-bar {
  position:fixed; bottom:0; left:0; right:0;
  display:flex; justify-content:center;
  background:rgba(16,31,54,0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  z-index:20;
}
.tab-bar-inner { display:flex; justify-content:space-between; gap:2px; width:100%; max-width:640px; }
.tab-bar-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--text-secondary);
  font-family:'Inter', sans-serif; font-size:11px; font-weight:600;
  flex:1; padding:4px 6px; border-radius:12px; cursor:pointer; transition: color 0.15s;
}
.tab-bar-btn.active { color:var(--accent); }
.tab-bar-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.link-btn { background:none; border:none; color:var(--text-secondary); font-size:12px; text-decoration:underline; cursor:pointer; }
.link-btn:hover { color:var(--silver); }
.reset-confirm { display:flex; align-items:center; justify-content:center; gap:10px; font-size:12.5px; color:var(--negative); flex-wrap:wrap; }

.loading-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--text-secondary); font-family:'Inter', sans-serif; }

@media (max-width: 480px) {
  .masthead { font-size:19px; }
  .card { padding:16px; }
  .amount-mono.big { font-size:23px; }
  .progress-track { width:90px; }
  .ledger-row { flex-direction:column; align-items:flex-start; }
  .row-actions { width:100%; justify-content:space-between; }
  .legend-pct { min-width:auto; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation:none !important; transition:none !important; }
}
